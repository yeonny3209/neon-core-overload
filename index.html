G.orbitals=[];
function skillCdMul(){ let m=1; if(G.aug.skill_cd) m*=.7; if(G.aug.skill_spam) m*=.3; return m; }
function skillReady(s){
 if(G.aug.time_lord&&s.id!=='freeze') return false;
 if(s.id==='repair') return s.uses>0;
 return s.cd<=0;
}
function useSkill(i){
 const s=G.skills[i];
 if(!s||G.over||G.cine||G.augPending||G.paused) return;
 if(!skillReady(s)){ SND.play('nope'); if(G.aug.time_lord&&s.id!=='freeze') toast('시간의 주인: 시간 동결만 쓸 수 있어요','bad'); return; }
 if(SKILLS[s.id].aim){
  G.aimSkill=G.aimSkill===i?null:i;
  if(G.aimSkill!==null){ G.buy=null; closePop(); tip('폭격할 곳을 누르세요'); }
  else tip('');
  buildSkills();
  return;
 }
 fireSkill(i);
}
function fireSkill(i,x,y){
 const s=G.skills[i], A=G.aug;
 switch(s.id){
  case 'orbital': orbitalAt(x,y,false); break;
  case 'freeze': {
   const d=4+(A.freeze_long?3:0);
   G.freezeT=d; G.freezeBoss=d-2;
   for(const e of G.enemies) if(e.alive) e.frostT=d;
   screenFlash('rgba(127,216,255,.6)'); SND.play('skfreeze');
   banner('시간 동결','',false);
   break;
  }
  case 'overclock': G.overclockT=8*(A.overclock_long?2:1); SND.play('overclock'); screenFlash('rgba(255,79,216,.45)'); for(const t of G.towers) ring(t.x,t.y,22,'#ff4fd8',.5,2); break;
  case 'repair': s.uses--; healCore(5); SND.play('repair'); break;
  case 'surge': {
   const ch=G.mode==='chaos'?1+G.wave*.02:CH_GOLD[G.st.ch];
   const g=Math.round((60+G.wave*14)*ch*(A.surge_more?2:1));
   G.gold+=g; say(W/2,H-60,'+'+g+' 에너지','#ffc247',18); SND.play('surge');
   break;
  }
 }
 if(s.id!=='repair'){
  s.cd=SKILLS[s.id].cd*skillCdMul();
  if(A.time_lord&&s.id==='freeze') s.cd=10;
 }
 if(A.chain_react) for(const o of G.skills) if(o!==s) o.cd=Math.max(0,o.cd-10);
 if(A.skill_spam){ G.lives-=1; if(G.lives<=0){ G.lives=0; gameOver(false); } }
 G.stats.skillsUsed++;
 G.aimSkill=null; tip('');
 buildSkills();
 tutEvent('skill');
}
function orbitalAt(x,y,auto){
 const A=G.aug;
 G.orbitals.push({x:x,y:y,t:1,max:1,r:80*(A.skill_dmg?1.5:1),auto:auto});
 SND.play('orbitalcharge');
}
function orbitalDmg(){ return 230*hpMulNow(Math.max(1,G.wave))*(G.aug.skill_dmg?2:1); }
function stepSkills(dt){
 for(const s of G.skills) if(s.cd>0) s.cd=Math.max(0,s.cd-dt);
 if(G.overclockT>0) G.overclockT-=dt;
 if(G.freezeT>0) G.freezeT-=dt;
 if(G.firstStrikeT>0) G.firstStrikeT-=dt;
 for(let i=G.orbitals.length-1;i>=0;i--){
  const o=G.orbitals[i]; o.t-=dt;
  if(o.t>0) continue;
  G.orbitals.splice(i,1);
  const d=orbitalDmg()*(o.auto?.6:1), r2=o.r*o.r;
  for(const e of G.enemies){ if(e.alive&&d2(o.x,o.y,e.x,e.y)<=r2+e.r*e.r) hurt(e,e.D.boss?d*.5:d,{kind:'skill',silent:false}); }
  addFx({k:'orbital',x:o.x,y:o.y,r:o.r,life:.6,max:.6});
  boom(o.x,o.y,o.r,'#ff9aea'); burst(o.x,o.y,'#ffd6f6',40,3);
  G.shake=Math.max(G.shake,12); SND.play('orbital');
 }
 const A=G.aug;
 if(A.storm_core&&G.waveOn){
  G.stormT-=dt;
  if(G.stormT<=0){
   G.stormT=3;
   let best=null; for(const e of G.enemies) if(e.alive&&e.vis&&(!best||e.prog>best.prog)) best=e;
   if(best){ const c=G.paths[0].core; hurt(best,70*hpMulNow(G.wave),{kind:'skill'}); boltFx([{x:c.x,y:c.y},{x:(c.x+best.x)/2+rnd(-20,20),y:(c.y+best.y)/2+rnd(-20,20)},{x:best.x,y:best.y}],'#7dfcff',.25); SND.play('arc',200); }
  }
 }
 if(A.orbital_auto&&G.waveOn){
  G.orbAutoT-=dt;
  if(G.orbAutoT<=0){
   G.orbAutoT=12;
   let best=null; for(const e of G.enemies) if(e.alive&&e.vis&&(!best||e.hp>best.hp)) best=e;
   if(best) orbitalAt(best.x,best.y,true);
  }
 }
 if(A.freeze_wave&&G.waveOn&&G.waveT<.05&&G.waveT>0){ G.freezeT=Math.max(G.freezeT,3); G.freezeBoss=Math.max(0,G.freezeT-1); }
}

/* ═══════════ 그림 도구 ═══════════
   그림자 효과(shadowBlur) 대신 미리 그려 둔 빛 번짐 그림을 겹쳐 그린다 — 태블릿에서도 가볍다. */
function hexA(c,a){
 if(c[0]!=='#') return c;
 const n=parseInt(c.slice(1),16);
 return 'rgba('+(n>>16&255)+','+(n>>8&255)+','+(n&255)+','+a+')';
}
const GLOW={};
function glowSprite(col){
 let s=GLOW[col]; if(s) return s;
 s=document.createElement('canvas'); s.width=s.height=64;
 const g=s.getContext('2d'), gr=g.createRadialGradient(32,32,0,32,32,32);
 gr.addColorStop(0,hexA(col,.95)); gr.addColorStop(.3,hexA(col,.42)); gr.addColorStop(1,hexA(col,0));
 g.fillStyle=gr; g.fillRect(0,0,64,64);
 GLOW[col]=s; return s;
}
function glow(g,x,y,r,col,a){
 if(a<=0) return;
 g.globalAlpha=a; g.drawImage(glowSprite(col),x-r,y-r,r*2,r*2); g.globalAlpha=1;
}
function rrect(g,x,y,w,h,r){
 g.beginPath(); g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r); g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath();
}
function poly(g,x,y,r,n,rot){
 g.beginPath();
 for(let i=0;i<n;i++){ const a=rot+i/n*TAU; if(i) g.lineTo(x+Math.cos(a)*r,y+Math.sin(a)*r); else g.moveTo(x+Math.cos(a)*r,y+Math.sin(a)*r); }
 g.closePath();
}
function circ(g,x,y,r){ g.beginPath(); g.arc(x,y,r,0,TAU); }
function star(g,x,y,r1,r2,n,rot){
 g.beginPath();
 for(let i=0;i<n*2;i++){ const r=i%2?r2:r1, a=rot+i/(n*2)*TAU; if(i) g.lineTo(x+Math.cos(a)*r,y+Math.sin(a)*r); else g.moveTo(x+Math.cos(a)*r,y+Math.sin(a)*r); }
 g.closePath();
}
const INK='#0b1428', INK2='#14213f';

  { const p=1+Math.sin(T*3)*.08; g.scale(p,p);

   glow(g,0,0,14,c2,.45); g.fillStyle=c2; poly(g,0,0,11,4,0); g.fill(); g.fillStyle=INK; poly(g,0,0,5,4,0); g.fill();
   if(evo==='B'||evo2){ g.strokeStyle='#7dfcff'; g.lineWidth=1.6; g.beginPath(); g.moveTo(-14,4); g.lineTo(-14,-4); g.lineTo(-16,-2); g.moveTo(14,4); g.lineTo(14,-4); g.lineTo(16,-2); g.stroke(); } }

 case 'radar':

 case 'miner':

function drawEnemyShape(g,e,col,T){
 const r=e.r, s=e.D.shape;
 g.fillStyle='rgba(9,15,31,.85)'; g.strokeStyle=col; g.lineWidth=2;
 switch(s){
 case 'square': g.rotate(T*1.3+e.wob*.08); poly(g,0,0,r,4,0); g.fill(); g.stroke(); g.fillStyle=col; poly(g,0,0,r*.4,4,Math.PI/4); g.fill(); break;
 case 'tri': g.rotate(e.ang); g.beginPath(); g.moveTo(r*1.3,0); g.lineTo(-r*.8,r*.85); g.lineTo(-r*.3,0); g.lineTo(-r*.8,-r*.85); g.closePath(); g.fill(); g.stroke(); break;
 case 'hex': g.rotate(T*.45); poly(g,0,0,r,6,0); g.fill(); g.stroke(); g.globalAlpha=.5; g.lineWidth=3.4; poly(g,0,0,r*.7,6,Math.PI/6); g.stroke(); g.globalAlpha=1; g.fillStyle=col; poly(g,0,0,r*.3,6,0); g.fill(); break;
 case 'wing': { g.rotate(e.ang); const f=Math.sin(T*13+e.wob)*.45;
  g.beginPath(); g.moveTo(0,0); g.lineTo(-r*.95,-r*(1.05+f)); g.lineTo(-r*.15,-r*.25); g.closePath(); g.fill(); g.stroke();
  g.beginPath(); g.moveTo(0,0); g.lineTo(-r*.95,r*(1.05+f)); g.lineTo(-r*.15,r*.25); g.closePath(); g.fill(); g.stroke();
  poly(g,0,0,r*.6,4,0); g.fill(); g.stroke(); break; }
 case 'orb': circ(g,0,0,r); g.fill(); g.stroke(); g.save(); g.rotate(T*2.1); g.globalAlpha=.75; for(let i=0;i<3;i++){ g.beginPath(); g.arc(0,0,r*.58,i/3*TAU,i/3*TAU+.95); g.stroke(); } g.restore(); break;
 case 'plus': { g.rotate(T*.85); const a=r*.4; g.beginPath(); g.moveTo(-a,-r); g.lineTo(a,-r); g.lineTo(a,-a); g.lineTo(r,-a); g.lineTo(r,a); g.lineTo(a,a); g.lineTo(a,r); g.lineTo(-a,r); g.lineTo(-a,a); g.lineTo(-r,a); g.lineTo(-r,-a); g.lineTo(-a,-a); g.closePath(); g.fill(); g.stroke(); g.fillStyle=col; circ(g,0,0,r*.28); g.fill(); break; }
 case 'oct': g.rotate(T*.38); poly(g,0,0,r,8,Math.PI/8); g.fill(); g.stroke(); g.fillStyle=col; poly(g,0,0,r*.33,8,0); g.fill(); break;
 case 'star': g.globalAlpha=.55+Math.sin(T*8+e.wob)*.28; g.rotate(T*1.05); star(g,0,0,r,r*.44,5,0); g.fill(); g.stroke(); g.globalAlpha=1; break;
 case 'prism': g.rotate(e.ang+Math.PI/2); g.beginPath(); g.moveTo(0,-r*1.25); g.lineTo(r*.85,0); g.lineTo(0,r*1.25); g.lineTo(-r*.85,0); g.closePath(); g.fill(); g.stroke(); g.fillStyle=col; poly(g,0,0,r*.3,4,Math.PI/4); g.fill(); break;
 case 'gear': g.rotate(T*1.1); poly(g,0,0,r,8,0); g.fill(); g.stroke(); g.save(); g.lineWidth=3.2; g.globalAlpha=.6; for(let i=0;i<8;i++){ const a=i/8*TAU; g.beginPath(); g.moveTo(Math.cos(a)*r,Math.sin(a)*r); g.lineTo(Math.cos(a)*(r+4),Math.sin(a)*(r+4)); g.stroke(); } g.restore(); g.fillStyle=col; circ(g,0,0,r*.32); g.fill(); break;
 case 'ghost': { const wv=Math.sin(T*6+e.wob);
  g.beginPath(); g.arc(0,-r*.2,r,Math.PI,0); g.lineTo(r,r*.8);
  for(let i=0;i<4;i++){ const x=r-(i+.5)*r/2; g.quadraticCurveTo(x,r*(.4+(i%2?.5:0)+wv*.1),x-r/4,r*.8); }
  g.lineTo(-r,-r*.2); g.closePath(); g.fill(); g.stroke();
  g.fillStyle=col; circ(g,-r*.35,-r*.25,2); g.fill(); circ(g,r*.35,-r*.25,2); g.fill(); break; }
 case 'bearer': g.rotate(e.ang); poly(g,0,0,r,6,0); g.fill(); g.stroke();
  g.strokeStyle=e.blockT>0?'#ffffff':'#8fb3ff'; g.lineWidth=4; g.beginPath(); g.arc(0,0,r+5,-1,1); g.stroke(); break;
 case 'berserk': { const p=1+Math.sin(T*10)*.08*(1+(1-e.hp/e.maxHp)*2); g.scale(p,p); g.rotate(T*2); star(g,0,0,r*1.1,r*.55,7,0); g.fill(); g.stroke(); g.fillStyle=col; circ(g,0,0,r*.3); g.fill(); break; }
 case 'carrier': g.rotate(e.ang); rrect(g,-r*1.3,-r*.7,r*2.6,r*1.4,6); g.fill(); g.stroke();
  g.fillStyle=hexA(col,.7); for(let i=-1;i<=1;i++) g.fillRect(i*r*.7-3,-r*.35,6,r*.7);
  g.fillStyle=col; g.fillRect(r*1.1,-3,6,6); break;
 }
}

/* ═══════════ 거대 보스 그림 ═══════════ */
function drawBoss(g,e,T){
 const r=e.r, ph=e.phase, col=e.col;
 glow(g,0,0,r*2.4,col,.35+.1*Math.sin(T*3));
 g.lineJoin='round';
 if(e.type==='crusher'){
  g.save(); g.rotate(e.ang);
  /* 무한궤도 */
  g.fillStyle='#1a1020'; g.strokeStyle=hexA(col,.7); g.lineWidth=2;
  rrect(g,-r*1.15,-r*.95,r*2.1,r*.42,8); g.fill(); g.stroke(); rrect(g,-r*1.15,r*.53,r*2.1,r*.42,8); g.fill(); g.stroke();
  g.strokeStyle=hexA(col,.5); g.lineWidth=1.5;
  for(let i=0;i<8;i++){ const x=-r*1.1+((i*r*.28+T*40)%(r*2)); g.beginPath(); g.moveTo(x,-r*.95); g.lineTo(x,-r*.53); g.moveTo(x,r*.53); g.lineTo(x,r*.95); g.stroke(); }
  /* 몸체 */
  g.fillStyle='#2a1408'; g.strokeStyle=col; g.lineWidth=3;
  rrect(g,-r*.95,-r*.6,r*1.7,r*1.2,12); g.fill(); g.stroke();
  g.fillStyle=hexA(col,ph>=2?.5:.3); rrect(g,-r*.6,-r*.35,r*.8,r*.7,6); g.fill();
  /* 드릴 */
  for(const sy of [-1,1]){
   g.save(); g.translate(r*.75,sy*r*.35);
   g.fillStyle=ph===3?'#ffd36b':'#c9844a'; g.beginPath(); g.moveTo(0,-r*.22); g.lineTo(r*.75,0); g.lineTo(0,r*.22); g.closePath(); g.fill();
   g.strokeStyle='#1a1020'; g.lineWidth=2; for(let i=0;i<4;i++){ const x=((i*.2+T*2)%.8)*r; g.beginPath(); g.moveTo(x,-r*.22*(1-x/(r*.75))); g.lineTo(x+r*.08,r*.22*(1-x/(r*.75))); g.stroke(); }
   g.restore();
  }
  if(ph===3){ g.fillStyle='#ff4d6d'; for(let i=0;i<3;i++){ circ(g,-r*.75,-r*.3+i*r*.3,3); g.fill(); } }
  g.restore();
 } else if(e.type==='hive'){
  const n=24;
  g.fillStyle='rgba(40,14,60,.9)'; g.strokeStyle=col; g.lineWidth=3;
  g.beginPath();
  for(let i=0;i<=n;i++){ const a=i/n*TAU, rr=r*(1+.08*Math.sin(a*5+T*3)+.05*Math.sin(a*3-T*2)); const x=Math.cos(a)*rr, y=Math.sin(a)*rr; if(i) g.lineTo(x,y); else g.moveTo(x,y); }
  g.closePath(); g.fill(); g.stroke();
  g.fillStyle=hexA(col,.35);
  for(let i=0;i<5;i++){ const a=i/5*TAU+T*.3; circ(g,Math.cos(a)*r*.45,Math.sin(a)*r*.45,r*.2); g.fill(); }
  g.fillStyle='#ffe6ff'; circ(g,0,0,r*.22+Math.sin(T*4)*2); g.fill();
  for(let i=0;i<6;i++){ const a=i/6*TAU-T*.8, d=r*1.35; g.fillStyle=col; circ(g,Math.cos(a)*d,Math.sin(a)*d,5+Math.sin(T*5+i)*1.5); g.fill(); }
  if(e.twin){ g.strokeStyle='#ffffff'; g.lineWidth=1; circ(g,0,0,r*.6); g.stroke(); }
 } else {
  /* 오버로드 */
  g.save(); g.rotate(T*.4);
  g.strokeStyle=hexA(col,.7); g.lineWidth=3; poly(g,0,0,r*1.3,3,0); g.stroke();
  for(let i=0;i<3;i++){ const a=i/3*TAU; g.fillStyle=col; star(g,Math.cos(a)*r*1.3,Math.sin(a)*r*1.3,8,3,4,T); g.fill(); }
  g.restore();
  g.save(); g.rotate(-T*.7); g.strokeStyle=hexA('#ffc247',.75); g.lineWidth=2; poly(g,0,0,r*1.1,6,0); g.stroke();
  for(let i=0;i<6;i++){ const a=i/6*TAU; g.beginPath(); g.moveTo(Math.cos(a)*r*1.1,Math.sin(a)*r*1.1); g.lineTo(Math.cos(a)*r*1.35,Math.sin(a)*r*1.35); g.stroke(); }
  g.restore();
  g.fillStyle='#1a0610'; g.strokeStyle=col; g.lineWidth=3; circ(g,0,0,r*.85); g.fill(); g.stroke();
  /* 눈 */
  const c=G.paths.length?G.paths[0].core:{x:e.x+10,y:e.y}, la=Math.atan2(c.y-e.y,c.x-e.x);
  g.fillStyle=ph===3?'#ff1f4b':'#ff4d6d'; g.beginPath(); g.ellipse(0,0,r*.6,r*.36,0,0,TAU); g.fill();
  g.fillStyle='#ffe0e6'; circ(g,Math.cos(la)*r*.2,Math.sin(la)*r*.12,r*.2); g.fill();
  g.fillStyle='#000'; circ(g,Math.cos(la)*r*.24,Math.sin(la)*r*.14,r*.09); g.fill();
  if(ph===3){ glow(g,0,0,r*3,'#ff1f4b',.3+.15*Math.sin(T*8)); }
 }
 /* 약점 */
 const wx=Math.cos(e.wpAng)*r*.9, wy=Math.sin(e.wpAng)*r*.9;
 glow(g,wx,wy,16+(e.wpHit>0?8:0),'#fff2a8',.8);
 g.fillStyle=e.wpHit>0?'#ffffff':'#fff2a8'; circ(g,wx,wy,5); g.fill();
 g.strokeStyle='#fff2a8'; g.lineWidth=1.5; circ(g,wx,wy,9+Math.sin(T*6)*2); g.stroke();
}

function towerIcon(cv,id,evo,evo2,lv){

function enemyIcon(cv,type){
 const S2=120; cv.width=S2; cv.height=S2;
 const g=cv.getContext('2d'); g.clearRect(0,0,S2,S2);
 const D=ENEMIES[type];
 const e={type:type,D:D,r:D.r,col:D.col,ang:-.4,wob:0,hp:1,maxHp:1,phase:1,wpAng:-1.2,wpHit:0,blockT:0,x:0,y:0};

 g.restore();
}

 }

 g.strokeStyle='rgba(120,170,255,.045)'; g.lineWidth=1;
 for(let x=0;x<=W;x+=TILE){ g.beginPath(); g.moveTo(x+.5,0); g.lineTo(x+.5,H); g.stroke(); }
 for(let y=0;y<=H;y+=TILE){ g.beginPath(); g.moveTo(0,y+.5); g.lineTo(W,y+.5); g.stroke(); }

 const vg=g.createRadialGradient(W/2,H/2,H*.45,W/2,H/2,H*.95);
 vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(0,0,0,.55)');

/* ── 배경에 떠도는 입자: 챕터마다 비 · 물방울 · 별빛 ── */
let AMB=null, AMBkey='', rLast=0;
function ambInit(){
 const rng=mulberry32(G.st.ch*31+7), n=G.lowfx?30:64; AMB=[];
 for(let i=0;i<n;i++) AMB.push({x:rng()*W,y:rng()*H,s:rng(),p:rng()*TAU,v:.45+rng()});
 AMBkey=G.mapId+'|'+G.mode;
}
function drawAmbient(g,T,dt){
 if(!AMB||AMBkey!==G.mapId+'|'+G.mode) ambInit();
 const ch=G.st.ch;
 g.save(); g.globalCompositeOperation='lighter';
 for(let i=0;i<AMB.length;i++){
  const a=AMB[i];
  if(G.lowfx&&(i&1)) continue;
  if(ch===0){
   a.y+=a.v*640*dt; a.x-=a.v*95*dt;
   if(a.y>H){ a.y=-24; a.x=Math.random()*(W+80); } if(a.x<-30) a.x+=W+60;
   g.strokeStyle='rgba(150,205,255,'+(.1+.12*a.s)+')'; g.lineWidth=1;
   g.beginPath(); g.moveTo(a.x,a.y); g.lineTo(a.x+6,a.y-20*a.v); g.stroke();
  } else if(ch===1){
   a.y-=a.v*28*dt; a.x+=Math.sin(T*1.2+a.p)*12*dt;
   if(a.y<-12){ a.y=H+12; a.x=Math.random()*W; }
   g.strokeStyle='rgba(120,205,255,'+(.14+.16*a.s)+')'; g.lineWidth=1;
   g.beginPath(); g.arc(a.x,a.y,2+a.s*5,0,TAU); g.stroke();
  } else {
   a.x+=a.v*7*dt; if(a.x>W+5) a.x=-5;
   const tw=.5+.5*Math.sin(T*(1+a.v)+a.p);
   g.fillStyle='rgba(255,232,190,'+(.1+.5*tw*a.s)+')'; const sz=1.4+a.s*1.8; g.fillRect(a.x,a.y,sz,sz);
  }
 }
 g.restore();
}
/* 회랑 위로 적이 가는 방향으로 빛이 흐른다 */
function drawFlow(g,T){
 g.save(); g.globalCompositeOperation='lighter'; g.lineCap='round'; g.lineJoin='round';
 const acc=CHAPTERS[G.st.ch].acc;
 for(const P of G.paths){
  if(!P.p2d){ const p=new Path2D(); P.pts.forEach((q,i)=>i?p.lineTo(q.x,q.y):p.moveTo(q.x,q.y)); P.p2d=p; }
  g.strokeStyle=hexA(acc,.5); g.lineWidth=3; g.setLineDash([2,26]); g.lineDashOffset=-T*70; g.stroke(P.p2d);
  if(!G.lowfx){ g.strokeStyle='rgba(255,255,255,.16)'; g.lineWidth=1.2; g.setLineDash([10,34]); g.lineDashOffset=-T*96; g.stroke(P.p2d); }
 }
 g.setLineDash([]); g.restore();
}

function render(){
 if(!G.paths.length) return;
 if(!BG||BGkey!==G.mapId+'|'+G.mode) buildBG();
 const T=performance.now()/1000, g=cx;
 g.setTransform(1,0,0,1,0,0);
 g.clearRect(0,0,W,H);
 g.save();
 /* 카메라 */
 const cam=G.cam;
 if(cam.z!==1||cam.x!==W/2||cam.y!==H/2){ g.translate(W/2,H/2); g.scale(cam.z,cam.z); g.translate(-cam.x,-cam.y); }
 if(G.shake>.05) g.translate(rnd(-G.shake,G.shake)*.6,rnd(-G.shake,G.shake)*.6);
 g.drawImage(BG,0,0);
 { const rdt=Math.min(.05,Math.max(0,T-(rLast||T))); rLast=T; drawAmbient(g,T,rdt); }
 drawFlow(g,T);
 drawTerrain(g,T);
 drawCore(g,T);
 drawPools(g,T);
 drawMines(g,T);
 drawHoverAndRange(g,T);
 drawTowers(g,T);
 drawEnemies(g,T,false);
 drawEnemies(g,T,true);
 drawShots(g,T);
 drawFx(g,T);
 drawTele(g,T);
 drawParts(g);
 drawTexts(g);
 drawAim(g,T);
 drawCoach(g,T);
 g.restore();
 /* 화면 전체 효과 */
 if(G.blackout>=0){ g.fillStyle='rgba(0,0,8,.5)'; g.fillRect(G.blackout===0?0:W/2,0,W/2,H); }
 if(G.overload){ g.fillStyle='rgba(255,20,60,'+(.08+.05*Math.sin(T*6))+')'; g.fillRect(0,0,W,H); }
 if(G.freezeT>0){ g.fillStyle='rgba(127,216,255,'+Math.min(.18,G.freezeT*.06)+')'; g.fillRect(0,0,W,H); }
 if(G.overclockT>0){ g.strokeStyle='rgba(255,79,216,'+(.35+.2*Math.sin(T*12))+')'; g.lineWidth=6; g.strokeRect(3,3,W-6,H-6); }
 if(G.slowmo>0){ g.fillStyle='rgba(255,255,255,'+(G.slowmo*.04)+')'; g.fillRect(0,0,W,H); }
 drawBossBar(g,T);
}

function drawTerrain(g,T){
 const p=.5+.5*Math.sin(T*3);
 g.save(); g.globalCompositeOperation='lighter';
 const etile=(k,col,icon)=>{
  const [tx,ty]=k.split(',').map(Number), x=tx*TILE, y=ty*TILE;
  g.fillStyle=hexA(col,.08+.08*p); g.fillRect(x+2,y+2,TILE-4,TILE-4);
  g.strokeStyle=hexA(col,.45+.25*p); g.lineWidth=1.5; g.strokeRect(x+3.5,y+3.5,TILE-7,TILE-7);
  g.fillStyle=hexA(col,.6);
  if(icon==='bolt'){ g.beginPath(); g.moveTo(x+22,y+9); g.lineTo(x+15,y+21); g.lineTo(x+20,y+21); g.lineTo(x+17,y+31); g.lineTo(x+26,y+18); g.lineTo(x+21,y+18); g.closePath(); g.fill(); }
  else { circ(g,x+20,y+18+Math.sin(T*2+tx)*2,4); g.fill(); g.beginPath(); g.moveTo(x+16,y+18); g.lineTo(x+20,y+10); g.lineTo(x+24,y+18); g.fill(); }
 };
 for(const k of G.energy) etile(k,'#2fe0ff','bolt');
 for(const k of G.moving) etile(k,'#ffc247','bolt');
 for(const k of G.coolant) etile(k,'#5aa8ff','drop');
 g.restore();
 for(const z of G.em){
  const x=(z.tx-1)*TILE, y=(z.ty-1)*TILE;
  g.fillStyle='rgba(169,139,255,.07)'; g.fillRect(x,y,TILE*3,TILE*3);
  g.strokeStyle='rgba(169,139,255,'+(.3+.2*p)+')'; g.lineWidth=1.5; g.setLineDash([6,6]); g.lineDashOffset=-T*20; g.strokeRect(x+.5,y+.5,TILE*3-1,TILE*3-1); g.setLineDash([]);
  if(Math.random()<.04) boltFx([{x:x+rnd(0,120),y:y+rnd(0,120)},{x:x+rnd(0,120),y:y+rnd(0,120)}],'#a98bff',.12);
 }
 for(const pd of G.pads){
  g.save(); g.translate(pd.x,pd.y); g.rotate(pd.ang);
  const rev=G.aug.pad_reverse;
  for(let i=0;i<3;i++){
   const o=((T*2+i/3)%1)*24-12;
   g.strokeStyle=rev?'rgba(94,242,164,'+(1-Math.abs(o)/12)+')':'rgba(255,154,60,'+(1-Math.abs(o)/12)+')'; g.lineWidth=3;
   g.beginPath(); g.moveTo(o-5*(rev?-1:1),-9); g.lineTo(o+5*(rev?-1:1),0); g.lineTo(o-5*(rev?-1:1),9); g.stroke();
  }
  g.restore();
 }
 for(const k of G.pathBuild){ const [tx,ty]=k.split(',').map(Number); g.strokeStyle='rgba(47,224,255,.6)'; g.lineWidth=2; g.strokeRect(tx*TILE+3,ty*TILE+3,TILE-6,TILE-6); }
}
function drawCore(g,T){
 const c=G.paths[0].core, low=G.lives<=5;
 const col=low?'#ff4d6d':CHAPTERS[G.st.ch].acc;
 g.save(); g.globalCompositeOperation='lighter';
 glow(g,c.x,c.y,70,col,.35+.15*Math.sin(T*(low?8:2)));
 g.restore();
 g.save(); g.translate(c.x,c.y);
 g.rotate(T*.6); g.strokeStyle=hexA(col,.6); g.lineWidth=2; poly(g,0,0,26,6,0); g.stroke();
 g.rotate(-T*1.4); g.strokeStyle=hexA(col,.35); poly(g,0,0,34,6,0); g.stroke();
 g.restore();
 g.fillStyle=col; poly(g,c.x,c.y,14+Math.sin(T*3)*1.5,6,Math.PI/6); g.fill();
 g.fillStyle='#ffffff'; poly(g,c.x,c.y,6,6,Math.PI/6); g.fill();
 if(G.cShield>0){ g.strokeStyle='rgba(125,252,255,'+(.5+.2*Math.sin(T*4))+')'; g.lineWidth=3; circ(g,c.x,c.y,44); g.stroke();
  g.fillStyle='#bff8ff'; g.font='700 11px Orbitron'; g.textAlign='center'; g.fillText(G.cShield,c.x,c.y-50); }
}
function drawPools(g,T){
 if(!G.pools.length&&!G.vortex.length) return;
 g.save(); g.globalCompositeOperation='lighter';
 for(const p of G.pools){ const a=clamp(p.t/p.max,0,1); glow(g,p.x,p.y,p.r*1.3,p.col,.55*a); }
 g.restore();
 for(const v of G.vortex){
  const a=clamp(v.t/v.max,0,1);
  g.save(); g.translate(v.x,v.y); g.rotate(-T*5);
  g.fillStyle='rgba(0,0,0,'+(.7*a)+')'; circ(g,0,0,v.r*.35); g.fill();
  g.strokeStyle=hexA(v.col,.7*a); g.lineWidth=2;
  for(let i=0;i<4;i++){ g.beginPath(); g.arc(0,0,v.r*(.4+i*.15),i,i+2.2); g.stroke(); }
  g.restore();
 }
}
function drawMines(g,T){

  const b=(Math.sin(T*8+m.x)>.3);
  g.fillStyle='#1a1408'; circ(g,m.x,m.y,6); g.fill();
  g.strokeStyle=m.col; g.lineWidth=1.5; g.stroke();
  if(b){ g.fillStyle=m.arm>0?'#666':'#ff4d6d'; circ(g,m.x,m.y,2); g.fill(); }

function drawHoverAndRange(g,T){
 const h=G.hover;

  const x=h.tx*TILE, y=h.ty*TILE, col=ok?'#5ef2a4':'#ff4d6d';
  g.fillStyle=hexA(col,.18); g.fillRect(x+1,y+1,TILE-2,TILE-2);
  g.strokeStyle=col; g.lineWidth=2; g.strokeRect(x+1.5,y+1.5,TILE-3,TILE-3);
  if(inGrid(h.tx,h.ty)){
   const base=towerBase(G.buy,0,null), rr=(base.rng||0)*(isEnergy(h.tx,h.ty)?1:1)*(inEm(h.tx,h.ty)?.8:1);
   if(rr){ g.fillStyle='rgba(255,255,255,.05)'; circ(g,x+20,y+20,rr); g.fill(); g.strokeStyle=hexA(col,.5); g.lineWidth=1.2; g.setLineDash([5,5]); g.stroke(); g.setLineDash([]); }
   g.globalAlpha=.6; g.save(); g.translate(x+20,y+20); drawTowerArt(g,G.buy,null,false,0,-Math.PI/2,0,0,T); g.restore(); g.globalAlpha=1;
   if(isEnergy(h.tx,h.ty)){ g.fillStyle='#2fe0ff'; g.font='700 11px sans-serif'; g.textAlign='center'; g.fillText('에너지 칸 · 피해 +'+(G.aug.energy_power?60:20)+'%',x+20,y-6); }
   else if(G.coolant.has(tkey(h.tx,h.ty))&&G.buy==='cryo'){ g.fillStyle='#5aa8ff'; g.font='700 11px sans-serif'; g.textAlign='center'; g.fillText('냉각수 칸 · 냉기 효과 2배',x+20,y-6); }
   else if(inEm(h.tx,h.ty)){ g.fillStyle='#a98bff'; g.font='700 11px sans-serif'; g.textAlign='center'; g.fillText('전자기장 · 사거리 -20%',x+20,y-6); }
  }

  g.strokeStyle='#ffffff'; g.lineWidth=2; rrect(g,s.x-21,s.y-21,42,42,10); g.stroke();

function drawTowers(g,T){
 const draw=(t,ghost)=>{
  g.save(); g.translate(t.x,t.y);
  if(ghost){ g.globalAlpha=.4+.15*Math.sin(T*6); }
  if(t.flash>0){ g.save(); g.globalCompositeOperation='lighter'; glow(g,0,0,40+t.flash*20,evoCol(t),Math.min(1,t.flash)); g.restore(); }
  /* 새로 지은 탑은 커지며 나타나고 번쩍인다 */
  const bage=G.time-t.born;
  if(bage>=0&&bage<.4){
   const bk=Math.min(1,bage/.34), bs=.5+.5*easeOut(bk)+.14*Math.sin(bk*Math.PI);
   g.scale(bs,bs);
   g.save(); g.globalCompositeOperation='lighter'; glow(g,0,0,40,t.D.col,(1-bage/.4)*.85); g.restore();
  }
  if(SAVE.d.cleared['3-4']&&t.evo&&SAVE.d.set.skin!==false){ g.save(); g.globalCompositeOperation='lighter'; glow(g,0,0,30,'#ffc247',.25+.1*Math.sin(T*2+t.x)); g.restore(); }
  let sp=t.spin;
  const w0=t.wep[0];
  if(w0&&w0.s.kind==='gatling') sp=t.spin*(.4+w0.spin*2.5);
  drawTowerArt(g,t.id,t.evo,t.evo2,t.lv,t.ang,t.recoil,sp,T);
  if(t.muzzle>0&&!G.lowfx){
   g.save(); g.globalCompositeOperation='lighter';
   glow(g,Math.cos(t.ang)*16,Math.sin(t.ang)*16,10+14*t.muzzle,evoCol(t),.9*t.muzzle); g.restore();
  }
  if(t.jam>G.time){
   g.globalAlpha=.6; g.fillStyle='rgba(5,8,16,.75)'; circ(g,0,0,19); g.fill();
   g.globalAlpha=.6+Math.sin(T*20)*.3; g.strokeStyle='#ffd34d'; g.lineWidth=2; g.setLineDash([4,4]); circ(g,0,0,21); g.stroke(); g.setLineDash([]);
   g.fillStyle='#ffd34d'; g.globalAlpha=1;
   g.beginPath(); g.moveTo(2,-9); g.lineTo(-5,1); g.lineTo(-1,1); g.lineTo(-3,9); g.lineTo(5,-2); g.lineTo(1,-2); g.closePath(); g.fill();
  }
  g.restore();
  /* 광선류 */
  for(const w of t.wep){
   if(w.beams&&w.beams.length&&t.jam<=G.time){
    for(const b of w.beams){
     const e=b.e, k=b.t/(S(t,w).rup||1), col=evoCol(t);
     g.save(); g.globalCompositeOperation='lighter';
     g.strokeStyle=hexA(col,.35); g.lineWidth=6+k*6; g.beginPath(); g.moveTo(t.x,t.y); g.lineTo(e.x,e.y); g.stroke();
     g.strokeStyle='#ffffff'; g.lineWidth=1.5+k*1.5; g.stroke();
     glow(g,e.x,e.y,12+k*10,col,.7);
     g.restore();
    }
   }
  }
 };
 for(const t of G.towers) draw(t,false);
 for(const t of G.ghosts) draw(t,true);
}
function drawEnemies(g,T,airPass){
 for(const e of G.enemies){
  if(!e.alive||!!e.air!==airPass) continue;
  const stealthy=e.D.stealth&&!e.vis;
  g.save(); g.translate(e.x,e.y);
  if(e.air){ g.save(); g.globalAlpha=.3; g.fillStyle='#000'; g.beginPath(); g.ellipse(4,e.r*1.15,e.r*.85,e.r*.3,0,0,TAU); g.fill(); g.restore(); }
  if(stealthy) g.globalAlpha=.16+.06*Math.sin(T*5+e.wob);
  else if(e.D.stealth) g.globalAlpha=.7;
  const col=e.hitT>0?'#ffffff':e.col;

let titleRAF=0;
function startTitleBG(){
 const c=$('#title-bg'), g=c.getContext('2d');
 cancelAnimationFrame(titleRAF);
 const rng=mulberry32(7), blds=[], motes=[];
 for(let i=0;i<46;i++) motes.push({x:rng(),y:rng(),v:.02+rng()*.05,s:rng(),c:rng()<.5?'#2fe0ff':'#ff4fd8'});
 for(let i=0;i<60;i++) blds.push({x:rng(),w:.02+rng()*.05,h:.08+rng()*.26,c:rng()<.5?'#2fe0ff':'#ff4fd8',l:rng()});
 const draw=()=>{
  if(G.scene!=='title') return;
  const w=c.clientWidth, h=c.clientHeight;
  if(c.width!==w||c.height!==h){ c.width=w; c.height=h; }
  const T=performance.now()/1000;
  const gr=g.createLinearGradient(0,0,0,h); gr.addColorStop(0,'#090418'); gr.addColorStop(.6,'#0b1430'); gr.addColorStop(1,'#04060e');
  g.fillStyle=gr; g.fillRect(0,0,w,h);
  /* 오버로드의 그림자 */
  const ox=w*.5, oy=h*.32, R=Math.min(w,h)*.32;
  g.save(); g.globalAlpha=.55;
  const og=g.createRadialGradient(ox,oy,0,ox,oy,R*1.6); og.addColorStop(0,'rgba(255,40,80,.35)'); og.addColorStop(1,'rgba(255,40,80,0)');
  g.fillStyle=og; g.fillRect(0,0,w,h);
  g.translate(ox,oy); g.rotate(T*.15); g.strokeStyle='rgba(255,77,109,.35)'; g.lineWidth=3; poly(g,0,0,R,3,0); g.stroke();
  g.rotate(-T*.35); g.strokeStyle='rgba(255,194,71,.22)'; poly(g,0,0,R*.82,6,0); g.stroke();
  g.fillStyle='rgba(255,40,80,'+(.25+.1*Math.sin(T*2))+')'; g.beginPath(); g.ellipse(0,0,R*.32,R*.18,0,0,TAU); g.fill();
  g.restore();
  /* 도시 */
  for(const b of blds){
   const bx=b.x*w, bw=b.w*w, bh=b.h*h, by=h-bh;
   g.fillStyle='#070c1c'; g.fillRect(bx,by,bw,bh);
   g.fillStyle=hexA(b.c,.25+.15*Math.sin(T*1.5+b.l*9));
   for(let k=0;k<bh/16;k++) if((k*7+b.l*10|0)%3) g.fillRect(bx+3,by+6+k*16,bw-6,2);
   g.fillStyle=hexA(b.c,.7); g.fillRect(bx,by,bw,1.5);
  }
  const hg=g.createLinearGradient(0,h*.7,0,h); hg.addColorStop(0,'rgba(47,224,255,0)'); hg.addColorStop(1,'rgba(47,224,255,.12)');
  g.fillStyle=hg; g.fillRect(0,h*.7,w,h*.3);
  for(const m of motes){
   m.y-=m.v*.016; if(m.y<-.02){ m.y=1.02; m.x=Math.random(); }
   const a=.25+.5*Math.abs(Math.sin(T*.8+m.s*9));
   g.globalAlpha=a*(.3+.7*(1-m.y)); g.fillStyle=m.c; const sz=1.5+m.s*2.5; g.fillRect(m.x*w+Math.sin(T+m.s*7)*8,m.y*h,sz,sz);
  }
  g.globalAlpha=1;
  titleRAF=requestAnimationFrame(draw);
 };
 draw();
}

function stepCine(dt){

 if(c.t>=c.dur) endCine();
}

 }
 const s=openModal('<div class="kicker">CODEX</div><h2>방어탑 도감</h2><p class="lead">'+ut.length+' / 20종 해금 · LV3까지 강화하면 A와 B 중 하나로 진화해요.</p><div class="codex">'+h+'</div><div class="row"><button class="btn big" id="cx-x">닫기</button></div>');
 s.querySelectorAll('canvas[data-ic]').forEach(c=>towerIcon(c,c.dataset.ic,c.dataset.evo||null));
 $('#cx-x').onclick=closeModal;

/* ═══════════ 입력 ═══════════
   터치와 마우스를 똑같이: 상점 카드를 누르고 칸을 누르거나, 카드를 끌어다 놓는다. */
function toLogical(clientX,clientY){
 const r=cv.getBoundingClientRect();
 const x=(clientX-r.left)/r.width*W, y=(clientY-r.top)/r.height*H;
 return {x:x,y:y,tx:Math.floor(x/TILE),ty:Math.floor(y/TILE),inside:clientX>=r.left&&clientX<=r.right&&clientY>=r.top&&clientY<=r.bottom};
}
let drag=null;
function bindShopCard(el,id){
 el.addEventListener('pointerdown',ev=>{
  ev.preventDefault();
  SND.init(); SND.resume();
  drag={id:id,x:ev.clientX,y:ev.clientY,moved:false,el:el,t:performance.now(),pid:ev.pointerId};
  el.setPointerCapture&&el.setPointerCapture(ev.pointerId);
 });
 el.addEventListener('pointermove',ev=>{
  if(!drag||drag.el!==el) return;
  if(!drag.moved&&Math.hypot(ev.clientX-drag.x,ev.clientY-drag.y)>10){ drag.moved=true; G.buy=id; G.aimSkill=null; closePop(); syncShop(); }
  if(drag.moved){ const p=toLogical(ev.clientX,ev.clientY); G.hover=p.inside?p:null; }
 });
 const end=ev=>{
  if(!drag||drag.el!==el) return;
  const d=drag; drag=null;
  if(d.moved){
   const p=toLogical(ev.clientX,ev.clientY);
   if(p.inside&&ev.type==='pointerup') tryPlace(id,p.tx,p.ty);
   G.buy=null; G.hover=null;
  } else if(ev.type==='pointerup'){
   if(performance.now()-d.t>550){ const D=TOWERS[id]; toast('<b>'+D.n+'</b> · '+esc(D.desc)); }
   else { G.buy=G.buy===id?null:id; G.aimSkill=null; closePop(); SND.play('click'); if(G.buy) tip('설치할 칸을 누르세요'); else tip(''); }
  }
  syncShop();
 };
 el.addEventListener('pointerup',end);
 el.addEventListener('pointercancel',end);
}
function canvasTap(p){
 if(G.over||G.cine||G.talking) return;
 if(G.aimSkill!==null){ const i=G.aimSkill; fireSkill(i,p.x,p.y); return; }
 if(G.buy){
  const t=tryPlace(G.buy,p.tx,p.ty);
  if(t){ G.buy=null; tip(''); }
  syncShop();
  return;
 }
 const t=inGrid(p.tx,p.ty)?G.occ[p.ty*COLS+p.tx]:null;
 if(t){ if(G.sel===t) closePop(); else { openPop(t); SND.play('click'); } }
 else closePop();
}
cv.addEventListener('pointermove',ev=>{ if(drag) return; const p=toLogical(ev.clientX,ev.clientY); G.hover=p; });
cv.addEventListener('pointerleave',()=>{ if(!drag) G.hover=null; });
cv.addEventListener('pointerdown',ev=>{ SND.init(); SND.resume(); cv._down={x:ev.clientX,y:ev.clientY}; const p=toLogical(ev.clientX,ev.clientY); G.hover=p; });
cv.addEventListener('pointerup',ev=>{
 const d=cv._down; cv._down=null;
 if(!d||Math.hypot(ev.clientX-d.x,ev.clientY-d.y)>14) return;
 canvasTap(toLogical(ev.clientX,ev.clientY));
});
cv.addEventListener('contextmenu',ev=>{ ev.preventDefault(); G.buy=null; G.aimSkill=null; closePop(); tip(''); syncShop(); });

document.addEventListener('keydown',ev=>{
 if(G.scene!=='battle'||ev.repeat&&ev.code!=='Space') return;
 if(modalOpen()&&ev.code!=='Escape') return;
 const c=ev.code;
 if(/^Digit[1-7]$/.test(c)){ const id=G.loadout[+c.slice(5)-1]; if(id){ G.buy=G.buy===id?null:id; G.aimSkill=null; closePop(); syncShop(); tip(G.buy?'설치할 칸을 누르세요':''); } }
 else if(c==='KeyQ') useSkill(0);
 else if(c==='KeyW') useSkill(1);
 else if(c==='KeyU'&&G.sel){ if(G.sel.lv<2) upgradeTower(G.sel); renderPop(); }
 else if(c==='KeyX'&&G.sel) sellTower(G.sel);
 else if(c==='Space'){ ev.preventDefault(); SND.init(); callWave(); }
 else if(c==='KeyP') togglePause();
 else if(c==='BracketLeft') setSpeed(Math.max(1,G.speed-1));
 else if(c==='BracketRight') setSpeed(Math.min(3,G.speed+1));
 else if(c==='Escape'){
  if(modalOpen()&&!G.over&&!G.augPending&&!G.introOpen){ closeModal(); togglePause(false); return; }
  if(G.buy||G.aimSkill!==null||G.sel){ G.buy=null; G.aimSkill=null; closePop(); tip(''); syncShop(); syncSkills(); }
  else openMenu();
 }
});

/* ── 32-tutorial.js ── */
/* ═══════════ 튜토리얼 (1-1) ═══════════
   정보 단계는 [다음], 행동 단계는 실제로 해야 넘어간다. 이미 한 단계는 건너뛴다. */
const TUT={on:false,step:0,tiles:[],shown:''};
const TUT_STEPS=[
 {h:'코어를 지켜라',p:'적이 <b>회랑</b>을 따라 <b>코어</b>(빛나는 육각형)로 와요. 코어 내구도가 <b>0</b>이 되면 패배예요. 1분이면 배울 수 있어요!',hl:'core'},
 {h:'① 방어탑 고르기',p:'아래 <b>상점</b>에서 <b>펄스 터렛</b>을 누르거나, 끌어서 맵에 놓아 보세요.',dom:'#shop .scard2',chk:()=>!!G.buy||G.towers.length>0,pos:'top'},
 {h:'② 빈 칸에 설치하기',p:'<b>반짝이는 칸</b>을 눌러 설치하세요. 회랑과 가까울수록 좋아요. <b>2기</b>를 지어 보세요.',hl:'tiles',chk:()=>G.towers.length>=2},
 {h:'③ 웨이브 시작',p:'오른쪽 아래 <b>웨이브 호출</b>을 눌러 적을 불러요. 일찍 부르면 <b>보너스 에너지</b>를 받아요.',dom:'#d-call',chk:()=>G.wave>=1,pos:'top'},
 {h:'④ 강화하기',p:'설치한 탑을 <b>눌러서</b> 강화해 보세요. 에너지는 적을 잡으면 모여요.',chk:()=>G.towers.some(t=>t.lv>=1)||G.wave>=5,pos:'top'},
 {h:'⑤ 사령관 스킬',p:'위급할 땐 <b>궤도 폭격</b>! 버튼을 누른 뒤 적이 몰린 곳을 누르세요.',dom:'#skills',chk:()=>G.stats.skillsUsed>0||G.wave>=7,pos:'top'},
 {h:'⑥ 갈래 진화',p:'탑을 <b>LV3</b>까지 올리면 <b>A</b>나 <b>B</b>로 진화해요. 같은 탑도 전혀 다르게 변해요. 이제 마음껏 지켜 보세요!',last:1,pos:'top'}
];
function tutStart(){ TUT.on=true; TUT.step=0; tutGo(0); }
function tutHold(){ return TUT.on&&TUT.step<=3; }
function tutEvent(){ }
function tutEnd(done){
 const was=TUT.on;
 TUT.on=false;
 $$('.hl').forEach(e=>e.classList.remove('hl'));
 $('#coach').classList.add('hide');
 if(was&&done){ SAVE.d.tut=true; SAVE.save(); toast('튜토리얼 완료!','good'); }
}
function tutPickTiles(){
 TUT.tiles=[];
 const pts=[...G.pathTiles].map(k=>k.split(',').map(Number)), c=[];
 for(let ty=0;ty<ROWS;ty++) for(let tx=0;tx<COLS;tx++){
  if(!buildable(tx,ty)) continue;
  let v=0; for(const p of pts){ const dx=p[0]-tx, dy=p[1]-ty; if(dx*dx+dy*dy<=9) v++; }
  c.push({tx:tx,ty:ty,v:v+(isEnergy(tx,ty)?6:0)});
 }
 c.sort((a,b)=>b.v-a.v);
 for(const k of c){ if(TUT.tiles.length>=3) break; if(TUT.tiles.every(o=>Math.max(Math.abs(o.tx-k.tx),Math.abs(o.ty-k.ty))>=3)) TUT.tiles.push(k); }
}
function tutGo(n){
 TUT.step=n;
 $$('.hl').forEach(e=>e.classList.remove('hl'));
 if(n>=TUT_STEPS.length){ tutEnd(true); return; }
 const S2=TUT_STEPS[n];
 if(S2.hl==='tiles') tutPickTiles();
 if(S2.dom){ const el=document.querySelector(S2.dom); if(el) el.classList.add('hl'); }
 let dots=''; for(let i=0;i<TUT_STEPS.length;i++) dots+='<i class="'+(i<n?'dn':(i===n?'on':''))+'"></i>';
 const c=$('#coach');
 c.innerHTML='<div class="ch"><span class="cs">TUTORIAL '+(n+1)+' / '+TUT_STEPS.length+'</span><span class="cd">'+dots+'</span></div><h4>'+S2.h+'</h4><p>'+S2.p+'</p>'+
  '<div class="cb"><button class="skip" id="co-skip">튜토리얼 건너뛰기</button><span class="sp"></span>'+(S2.chk?'<span class="wait">직접 해 보세요</span>':'<button class="btn sm on" id="co-next">'+(S2.last?'시작하기!':'다음')+'</button>')+'</div>';
 c.classList.remove('hide');
 $('#co-skip').onclick=()=>tutEnd(true);
 const nx=$('#co-next'); if(nx) nx.onclick=()=>{ SND.play('click'); tutGo(n+1); };
 if(n>0) SND.play('build',80);
 tutPos();
}
function tutPos(){
 const S2=TUT_STEPS[TUT.step]; if(!S2) return;
 let pos=S2.pos||'top';
 if(S2.hl==='core') pos=G.paths[0].core.y<H/2?'bot':'top';
 if(S2.hl==='tiles'&&TUT.tiles.length){ let ay=0; for(const t of TUT.tiles) ay+=t.ty; pos=ay/TUT.tiles.length<ROWS/2?'bot':'top'; }
 $('#coach').classList.toggle('bot',pos==='bot');
}
function tutTick(){
 if(!TUT.on) return;
 const vis=G.scene==='battle'&&!modalOpen()&&!G.talking&&!G.over;
 $('#coach').classList.toggle('hide',!vis);
 let guard=0;
 while(TUT.step<TUT_STEPS.length&&TUT_STEPS[TUT.step].chk&&TUT_STEPS[TUT.step].chk()&&guard++<8) tutGo(TUT.step+1);
}
function drawCoach(g,T){
 if(!TUT.on) return;
 const S2=TUT_STEPS[TUT.step]; if(!S2||!S2.hl) return;
 const p=.5+.5*Math.sin(T*4);
 g.save();
 if(S2.hl==='core'){
  const c=G.paths[0].core;
  g.strokeStyle='#2fe0ff'; g.lineWidth=3; g.globalAlpha=.9-.4*p; circ(g,c.x,c.y,46+p*10); g.stroke();
  g.globalAlpha=.45; circ(g,c.x,c.y,64+p*14); g.stroke();
 } else if(S2.hl==='tiles'){
  for(const k of TUT.tiles){
   if(!buildable(k.tx,k.ty)) continue;
   const x=k.tx*TILE, y=k.ty*TILE;
   g.globalAlpha=.15+.25*p; g.fillStyle='#2fe0ff'; g.fillRect(x+2,y+2,TILE-4,TILE-4);
   g.globalAlpha=.95; g.strokeStyle='#2fe0ff'; g.lineWidth=2.5; g.strokeRect(x+3,y+3,TILE-6,TILE-6);
   const by=y-6-p*5; g.fillStyle='#2fe0ff'; g.beginPath(); g.moveTo(x+12,by-10); g.lineTo(x+28,by-10); g.lineTo(x+20,by); g.closePath(); g.fill();
  }
 }
 g.restore();
}

/* ── 40-main.js ── */
/* ═══════════ 메인 루프 ═══════════ */
let lastT=0, acc=0, fpsA=0, fpsN=0, fpsGood=0, hudT=0;
function simBlocked(){ return G.paused||G.talking||G.introOpen||G.augPending||G.over&&!G.fx.length; }
function loop(ts){
 requestAnimationFrame(loop);
 if(!lastT){ lastT=ts; return; }
 let dt=(ts-lastT)/1000; lastT=ts;
 if(dt>.25) dt=.25;
 /* 자동 저사양: 느리면 켜고, 한동안 여유가 있어야 끈다 */
 if(G.fxMode==='auto'&&G.scene==='battle'){
  fpsA+=dt; fpsN++;
  if(fpsA>=1.5){ const f=fpsN/fpsA; if(f<44){ G.lowfx=true; fpsGood=0; } else if(G.lowfx&&f>55&&++fpsGood>=6) G.lowfx=false; fpsA=0; fpsN=0; }
 }
 if(G.scene!=='battle') return;
 if(G.cine){ stepCine(dt); render(); return; }
 /* 진화 연출: 탑으로 살짝 다가갔다가 돌아온다 */
 if(G.punch){
  const pc=G.punch; pc.t+=dt; const pk=pc.t/pc.dur;
  if(pk>=1){ G.punch=null; G.cam={x:W/2,y:H/2,z:1}; }
  else { const f=Math.sin(pk*Math.PI), z=1+.3*f; G.cam.z=z; G.cam.x=lerp(W/2,clamp(pc.x,W/2/z,W-W/2/z),f); G.cam.y=lerp(H/2,clamp(pc.y,H/2/z,H-H/2/z),f); }
 }
 /* 보스 처치 슬로모션 */
 let sdt=dt;
 if(G.slowmo>0){ G.slowmo-=dt; sdt=dt*.25; }
 if(!simBlocked()){
  acc+=sdt;
  let guard=0;
  while(acc>=FIX&&guard++<8){
   acc-=FIX;
   for(let i=0;i<G.speed;i++){ step(FIX); if(G.cine||G.intro) break; }
   if(G.cine) break;
  }
 } else if(G.over){ stepFx(dt); }
 /* 보스가 화면 안으로 들어온 뒤에 등장 연출을 시작한다 */
 if(G.bossPending&&!G.cine){
  const e=G.bossPending;
  if(!e.alive) G.bossPending=null;
  else if((e.x>e.r&&e.x<W-e.r&&e.y>e.r&&e.y<H-e.r)||e.age>4){ G.bossPending=null; startCine(e); }
 }
 if(G.intro&&!G.cine&&!G.introOpen&&!modalOpen()){ const t=G.intro; G.intro=null; showIntro(t); }
 hudT+=dt;
 if(hudT>.1){ hudT=0; syncHUD(false); }
 tutTick();
 render();
}
