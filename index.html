:root{
  --bg:#05070f; --bg2:#0a1124; --panel:rgba(12,20,40,.86); --panel2:rgba(18,30,58,.92);
  --edge:rgba(120,170,255,.18); --edge2:rgba(120,170,255,.32);
  --ice:#eaf4ff; --mute:#9fb2d4; --dim:#61739a;
  --core:#2fe0ff; --mag:#ff4fd8; --gold:#ffc247; --good:#5ef2a4; --bad:#ff4d6d; --vio:#a98bff;
  --r-direct:#6fe4ff; --r-blast:#ff9a3c; --r-elem:#b58bff; --r-ctrl:#5ef2a4; --r-sup:#ffd34d;
  --font-d:'Orbitron',ui-sans-serif,system-ui,sans-serif;
  --font:'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',system-ui,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ice);font-family:var(--font);
  -webkit-tap-highlight-color:transparent;overscroll-behavior:none}
body{overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation}
button{font:inherit;color:inherit}
#app{position:fixed;inset:0;overflow:hidden;
  background:radial-gradient(1200px 700px at 50% 30%,#0d1a36 0%,#05070f 70%)}
.screen{position:absolute;inset:0;display:flex;flex-direction:column}
.hide{display:none!important}
small{font-size:.78em;color:var(--mute);font-weight:500}
kbd{font-family:var(--font-d);font-size:10px;padding:1px 5px;border-radius:4px;border:1px solid var(--edge2);color:var(--mute)}

/* ---------- 버튼 ---------- */
.btn{cursor:pointer;border:1px solid var(--edge2);background:rgba(255,255,255,.04);border-radius:10px;
  padding:9px 16px;font-weight:700;font-size:14px;transition:transform .12s,background .12s,box-shadow .12s,border-color .12s;
  min-height:40px;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.btn:hover{background:rgba(255,255,255,.08);border-color:rgba(160,200,255,.5)}
a.btn{text-decoration:none}
.btn:active{transform:scale(.97)}
.btn.on{background:rgba(47,224,255,.16);border-color:rgba(47,224,255,.7);color:#dff9ff;box-shadow:0 0 16px -6px var(--core)}
.btn.sm{min-height:34px;padding:6px 11px;font-size:13px;border-radius:9px}
.btn.big{font-family:var(--font-d),var(--font);font-size:16px;letter-spacing:.06em;padding:14px 36px;border-radius:12px;min-height:52px;
  background:linear-gradient(180deg,#5af0ff,#18b9e0);border:0;color:#03202b;box-shadow:0 12px 36px -12px var(--core)}
.btn.big:hover{filter:brightness(1.08);transform:translateY(-2px)}
.btn.big.alt{background:linear-gradient(180deg,#ff8ae6,#e23fc0);color:#2b0322;box-shadow:0 12px 36px -12px var(--mag)}
.btn.big.gold{background:linear-gradient(180deg,#ffe08a,#ffb22e);color:#2a1c00;box-shadow:0 12px 36px -12px var(--gold)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--mute)}
.btn.ghost:hover{color:var(--ice);background:rgba(255,255,255,.05)}
.btn.danger{border-color:rgba(255,77,109,.55);color:#ffb3c0}
.btn[disabled],.btn.off{opacity:.42;pointer-events:none}
.seg{display:inline-flex;border:1px solid var(--edge2);border-radius:10px;overflow:hidden}
.seg .btn{border:0;border-radius:0;min-height:34px}

/* ---------- 타이틀 ---------- */
#s-title{align-items:center;justify-content:center}
#title-bg{position:absolute;inset:0;width:100%;height:100%}
.t-wrap{position:relative;z-index:2;text-align:center;display:flex;flex-direction:column;align-items:center;padding:20px}
.t-kicker{font-family:var(--font-d);letter-spacing:.5em;font-size:12px;color:var(--core);opacity:.8;animation:rise .7s .05s both}
.t-name{margin:10px 0 0;font-size:clamp(34px,7vw,72px);font-weight:800;letter-spacing:-.01em;line-height:1.05;
  text-shadow:0 0 30px rgba(47,224,255,.5),0 0 90px rgba(47,224,255,.25);animation:rise .7s .12s both}
.t-sub{font-family:var(--font-d);font-weight:900;font-size:clamp(18px,3.4vw,34px);letter-spacing:.38em;margin-top:6px;
  background:linear-gradient(90deg,#ff4fd8,#ff4d6d,#ffc247);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 18px rgba(255,79,216,.45));animation:rise .7s .2s both, flick 6s 1.2s infinite}
.t-line{color:var(--mute);margin:16px 0 0;font-size:14px;animation:rise .7s .3s both}
.t-btns{display:flex;gap:14px;margin-top:30px;flex-wrap:wrap;justify-content:center;animation:rise .7s .4s both}
.t-small{display:flex;gap:6px;margin-top:16px;flex-wrap:wrap;justify-content:center;animation:rise .7s .5s both}
.t-foot{position:absolute;bottom:14px;left:0;right:0;text-align:center;font-size:11.5px;color:var(--dim);z-index:2}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes flick{0%,92%,100%{opacity:1}93%{opacity:.35}95%{opacity:1}96.5%{opacity:.5}}

/* ---------- 공통 상단 바 ---------- */
.bar{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--edge);background:rgba(5,9,20,.7);
  backdrop-filter:blur(6px);flex:none}
.bar-title{font-weight:800;font-size:16px;flex:1;text-align:center}
.bar-right{min-width:120px;display:flex;justify-content:flex-end}
.stars-total{font-family:var(--font-d);color:var(--gold);font-size:13px;font-weight:700}

/* ---------- 챕터 지도 ---------- */
.ch-tabs{display:flex;gap:8px;justify-content:center;padding:10px;flex:none}
.ch-tab{min-width:150px}
.ch-tab .lock{font-size:12px;opacity:.7}
.map-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:6px 14px;min-height:0}
.map-board{position:relative;width:min(100%,calc((100dvh - 210px)*16/9));aspect-ratio:16/9;border-radius:18px;overflow:hidden;
  border:1px solid var(--edge2);box-shadow:0 30px 80px -30px rgba(0,0,0,.8),inset 0 0 80px rgba(47,224,255,.06)}
.map-board canvas{position:absolute;inset:0;width:100%;height:100%}
.node{position:absolute;transform:translate(-50%,-50%);width:62px;height:62px;border-radius:50%;cursor:pointer;
  border:2px solid rgba(47,224,255,.75);background:radial-gradient(circle at 50% 40%,rgba(47,224,255,.45),rgba(5,12,28,.9) 70%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--font-d);font-weight:800;font-size:14px;
  box-shadow:0 0 22px -4px var(--core);transition:transform .15s}
.node:hover{transform:translate(-50%,-50%) scale(1.08)}
.node .ns{font-size:10px;color:var(--gold);letter-spacing:1px;margin-top:1px;font-family:var(--font)}
.node.boss{width:78px;height:78px;border-color:rgba(255,77,109,.9);
  background:radial-gradient(circle at 50% 40%,rgba(255,77,109,.5),rgba(28,5,12,.92) 70%);box-shadow:0 0 30px -4px var(--bad)}
.node.lock{border-color:rgba(120,140,180,.35);background:rgba(10,16,30,.9);box-shadow:none;color:var(--dim);cursor:default}
.node.lock:hover{transform:translate(-50%,-50%)}
.node.next{animation:pulse 1.6s ease-in-out infinite}
.node .nn{font-size:10.5px;font-family:var(--font);font-weight:600;position:absolute;top:100%;margin-top:6px;white-space:nowrap;color:var(--ice);
  text-shadow:0 1px 4px #000}
@keyframes pulse{0%,100%{box-shadow:0 0 22px -4px var(--core)}50%{box-shadow:0 0 38px 4px var(--core)}}
.map-info{flex:none;text-align:center;padding:8px 14px 14px;color:var(--mute);font-size:13px;min-height:40px}

/* ---------- 준비 ---------- */
.prep-body{flex:1;display:grid;grid-template-columns:1fr 340px;gap:16px;padding:14px;min-height:0;overflow:auto}
.prep-col{min-width:0}
.prep-col h3{margin:4px 0 10px;font-size:14px;letter-spacing:.02em}
.prep-towers{display:grid;grid-template-columns:repeat(auto-fill,minmax(122px,1fr));gap:8px;margin-bottom:18px}
.tcard{position:relative;border:1px solid var(--edge);border-radius:12px;padding:10px 8px 8px;background:rgba(255,255,255,.03);
  cursor:pointer;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:112px;transition:transform .12s,border-color .12s}
.tcard:hover{transform:translateY(-2px);border-color:var(--edge2)}
.tcard canvas{width:48px;height:48px}
.tcard .tn{font-size:12.5px;font-weight:700}
.tcard .tc{font-family:var(--font-d);font-size:11px;color:var(--gold)}
.tcard .tr{font-size:10px;color:var(--mute)}
.tcard.on{border-color:rgba(47,224,255,.8);background:rgba(47,224,255,.1);box-shadow:0 0 18px -6px var(--core)}
.tcard.on::after{content:'✓';position:absolute;top:6px;right:8px;color:var(--core);font-weight:900}
.tcard.lock{opacity:.35;cursor:default}
.tcard.lock .tn::after{content:' 🔒'}
.prep-skills{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
.scard{border:1px solid var(--edge);border-radius:12px;padding:10px 12px;cursor:pointer;background:rgba(255,255,255,.03);display:flex;gap:10px;align-items:center}
.scard .si{font-size:24px;width:36px;text-align:center}
.scard .sn{font-weight:800;font-size:13.5px}
.scard .sd{font-size:11.5px;color:var(--mute);line-height:1.45}
.scard.on{border-color:rgba(255,79,216,.8);background:rgba(255,79,216,.1)}
.scard.lock{opacity:.35;cursor:default}
.side{background:var(--panel);border:1px solid var(--edge);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px;
  position:sticky;top:0;align-self:start;max-height:calc(100dvh - 90px);overflow:auto}
.prep-go{position:sticky;bottom:0;background:linear-gradient(0deg,rgba(12,20,40,1) 70%,rgba(12,20,40,0))}
.intel-row{display:flex;align-items:center;gap:8px;font-size:12.5px;padding:5px 0;border-bottom:1px dashed var(--edge)}
.intel-row:last-child{border:0}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;padding:3px 9px;border-radius:99px;border:1px solid var(--edge2);background:rgba(255,255,255,.04)}
.chip.new{border-color:rgba(255,194,71,.7);color:var(--gold)}
.chip.boss{border-color:rgba(255,77,109,.7);color:#ffb3c0}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.star-cond{display:flex;flex-direction:column;gap:5px;font-size:12.5px}
.star-cond div{display:flex;gap:8px;align-items:center}
.star-cond .st{color:var(--gold);font-family:var(--font-d);width:42px}
.prep-go{margin-top:auto;padding-top:10px;display:flex;justify-content:center}

/* ---------- 전투 ---------- */
#s-battle{background:#03050c}
.hud{flex:none;display:flex;align-items:center;gap:10px;padding:6px 10px;background:linear-gradient(180deg,rgba(8,14,30,.96),rgba(6,10,22,.9));
  border-bottom:1px solid var(--edge);height:52px}
.hud-l,.hud-r{display:flex;align-items:center;gap:6px}
.hud-c{flex:1;text-align:center;font-weight:700;font-size:13px;color:var(--mute);overflow:hidden;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
#h-stage{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%;line-height:1.1}
#h-next{display:flex;gap:8px;align-items:center;justify-content:center;height:22px;font-size:11px;color:var(--dim)}
#h-next .np{display:inline-flex;align-items:center;gap:2px;font-family:var(--font-d);font-weight:700;color:var(--mute)}
#h-next .np img{width:20px;height:20px}
#h-next .np.boss{color:#ffb3c0}
#h-next .np.boss img{width:24px;height:24px}
#wavebar{height:3px;background:rgba(255,255,255,.06);flex:none}
#wavebar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#18b9e0,#2fe0ff);transition:width .25s linear,background .3s}
#wavebar.war i{background:linear-gradient(90deg,#ff4fd8,#ff4d6d);box-shadow:0 0 10px #ff4fd8}
.ro{display:flex;flex-direction:column;align-items:flex-start;padding:3px 10px;border-radius:9px;border:1px solid var(--edge);background:rgba(255,255,255,.03);min-width:64px}
.ro .k{font-size:9.5px;letter-spacing:.12em;color:var(--dim);font-weight:700}
.ro .v{font-family:var(--font-d);font-weight:800;font-size:16px;line-height:1.1}
.ro.gold .v{color:var(--gold)} .ro.life .v{color:var(--good)} .ro.shield .v{color:#ffe066}
.ro.life.low .v{color:var(--bad);animation:blink .6s steps(2) infinite}
@keyframes blink{50%{opacity:.4}}
.stage{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
#game{display:block;touch-action:none;border-radius:4px}
#banner{position:absolute;left:0;right:0;top:34%;text-align:center;pointer-events:none;opacity:0}
#banner.show{animation:bann 2.1s ease forwards}
#banner .b-txt{font-family:var(--font-d),var(--font);font-size:clamp(26px,4.4vw,48px);font-weight:900;letter-spacing:.08em;
  text-shadow:0 0 24px rgba(47,224,255,.65)}
#banner .b-sub{font-size:14px;color:var(--mute);margin-top:6px;font-weight:700}
#banner.bad .b-txt{color:#ffd0d8;text-shadow:0 0 30px rgba(255,77,109,.8)}
@keyframes bann{0%{opacity:0;transform:scale(1.25)}12%{opacity:1;transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:translateY(-10px)}}
#tip{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);background:rgba(6,10,22,.86);border:1px solid var(--edge);
  border-radius:99px;padding:6px 14px;font-size:12.5px;color:var(--mute);pointer-events:none;white-space:nowrap}
#bossname{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
#bossname .bn-k{font-family:var(--font-d);letter-spacing:.5em;color:#ff8da1;font-size:13px;animation:bnIn .5s both}
#bossname .bn-n{font-size:clamp(34px,6vw,64px);font-weight:900;color:#fff;text-shadow:0 0 40px rgba(255,77,109,.9),0 0 90px rgba(255,77,109,.5);
  animation:bnSlam .6s cubic-bezier(.2,1.6,.4,1) .15s both}
#bossname .bn-q{margin-top:10px;font-size:15px;color:#ffd0d8;font-weight:700;animation:bnIn .5s .6s both}
@keyframes bnSlam{from{opacity:0;transform:scale(2.4)}to{opacity:1;transform:none}}
@keyframes bnIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
#skip-cine{position:absolute;right:12px;bottom:12px}

/* 탑 정보 팝업 */
#pop{position:absolute;z-index:20;width:268px;background:var(--panel2);border:1px solid var(--edge2);border-radius:14px;padding:12px;
  box-shadow:0 20px 50px -15px rgba(0,0,0,.85);font-size:12.5px}
#pop .ph{display:flex;align-items:center;gap:10px}
#pop .ph canvas{width:40px;height:40px;flex:none}
#pop .pn{font-weight:800;font-size:14.5px}
#pop .pl{font-size:11px;color:var(--mute)}
#pop .px{margin-left:auto;align-self:flex-start}
#pop .prow{display:grid;grid-template-columns:1fr 1fr;gap:3px 10px;margin:9px 0;color:var(--mute)}
#pop .prow b{color:var(--ice);font-family:var(--font-d);font-size:12px}
#pop .pdesc{color:var(--mute);line-height:1.5;margin-bottom:8px}
#pop .pacts{display:flex;gap:6px;flex-wrap:wrap}
#pop .pacts .btn{flex:1;min-height:42px}
#pop .evo{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
#pop .evo .btn{flex-direction:column;align-items:flex-start;white-space:normal;text-align:left;padding:8px 9px;min-height:70px;line-height:1.35}
#pop .evo .btn b{font-size:12.5px}
#pop .evo .btn span{font-size:10.5px;color:var(--mute);font-weight:500}
#pop .evo .btn.a{border-color:rgba(255,194,71,.6)} #pop .evo .btn.b{border-color:rgba(255,79,216,.6)}
#pop .modes{display:flex;gap:4px;margin-top:8px}
#pop .modes .btn{flex:1;font-size:11.5px;min-height:30px;padding:4px}
.cost{font-family:var(--font-d);color:var(--gold);font-size:11.5px}

/* 하단 도크 */
.dock{flex:none;position:relative;display:flex;align-items:stretch;gap:10px;padding:8px 10px;height:96px;
  background:linear-gradient(0deg,rgba(8,14,30,.98),rgba(6,10,22,.92));border-top:1px solid var(--edge);transition:height .2s}
.dock.fold{height:36px;padding-top:4px;padding-bottom:4px}
.dock.fold .shop,.dock.fold .skills,.dock.fold .callbox{display:none}
.dock-fold{position:absolute;left:50%;top:-14px;transform:translateX(-50%);width:44px;height:16px;border-radius:8px 8px 0 0;border:1px solid var(--edge);
  border-bottom:0;background:rgba(8,14,30,.98);color:var(--mute);font-size:11px;line-height:1;cursor:pointer;padding:0}
.dock.fold .dock-fold{top:-14px}
.shop{flex:1;display:flex;gap:6px;min-width:0;overflow-x:auto;scrollbar-width:none}
.shop::-webkit-scrollbar{display:none}
.scard2{position:relative;flex:none;width:86px;border:1px solid var(--edge);border-radius:12px;background:rgba(255,255,255,.035);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;cursor:grab;touch-action:none;transition:border-color .1s,transform .1s}
.scard2 canvas{width:38px;height:38px;pointer-events:none}
.scard2 .n{font-size:11px;font-weight:700;pointer-events:none;white-space:nowrap}
.scard2 .c{font-family:var(--font-d);font-size:11px;color:var(--gold);pointer-events:none}
.scard2 .hk{position:absolute;top:3px;left:6px;font-family:var(--font-d);font-size:9px;color:var(--dim);pointer-events:none}
.scard2.on{border-color:rgba(47,224,255,.9);background:rgba(47,224,255,.13);box-shadow:0 0 16px -4px var(--core)}
.scard2.poor{opacity:.45}
.scard2.poor .c{color:var(--bad)}
.skills{display:flex;gap:8px}
.skbtn{position:relative;width:74px;border-radius:14px;border:1px solid rgba(255,79,216,.5);background:rgba(255,79,216,.08);cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;overflow:hidden;padding:0}
.skbtn .i{font-size:24px;line-height:1;z-index:1}
.skbtn .n{font-size:10.5px;font-weight:800;z-index:1}
.skbtn .hk{position:absolute;top:3px;left:6px;font-family:var(--font-d);font-size:9px;color:var(--dim);z-index:1}
.skbtn .cd{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.62);z-index:0}
.skbtn .ct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--font-d);font-weight:800;font-size:18px;z-index:2;
  text-shadow:0 0 6px #000}
.skbtn.ready{box-shadow:0 0 18px -2px var(--mag);animation:skready 1.4s ease-in-out infinite}
.skbtn.aim{background:rgba(255,79,216,.3);border-color:#ff9aea}
@keyframes skready{50%{box-shadow:0 0 28px 2px var(--mag)}}
.callbox{display:flex;flex-direction:column;gap:5px;width:132px}
.btn.call{flex:1;flex-direction:column;gap:0;background:linear-gradient(180deg,rgba(47,224,255,.25),rgba(47,224,255,.1));border-color:rgba(47,224,255,.7);
  font-size:13.5px;line-height:1.2}
.btn.call small{font-family:var(--font-d);font-size:10.5px;color:#9fefff}
.btn.call.busy{background:rgba(255,255,255,.04);border-color:var(--edge);color:var(--mute)}
.callbox .btn.sm{min-height:26px;font-size:11px}

/* ---------- 모달 ---------- */
#modal{position:absolute;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:14px;
  background:rgba(2,4,10,.72);backdrop-filter:blur(5px);animation:fadeIn .2s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.sheet{width:min(880px,100%);max-height:100%;overflow:auto;background:linear-gradient(180deg,rgba(14,24,48,.97),rgba(7,12,26,.97));
  border:1px solid var(--edge2);border-radius:18px;padding:22px 24px;box-shadow:0 40px 100px -30px rgba(0,0,0,.9);animation:sheetIn .3s cubic-bezier(.2,1.2,.4,1)}
@keyframes sheetIn{from{opacity:0;transform:translateY(16px) scale(.98)}to{opacity:1;transform:none}}
.sheet h2{margin:0 0 4px;font-size:24px}
.sheet .lead{color:var(--mute);margin:0 0 14px;font-size:13.5px;line-height:1.6}
.sheet .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:16px}
.sheet.narrow{width:min(480px,100%)}
.kicker{font-family:var(--font-d);font-size:11px;letter-spacing:.3em;color:var(--core);margin-bottom:6px}
.kicker.bad{color:#ff8da1}

/* 결과 */
.res-stars{display:flex;gap:14px;justify-content:center;margin:14px 0 6px}
.res-star{font-size:56px;color:#24304a;line-height:1;transform:scale(.4);opacity:0}
.res-star.got{color:var(--gold);text-shadow:0 0 24px rgba(255,194,71,.8);animation:starIn .55s cubic-bezier(.2,1.8,.4,1) forwards}
.res-star.miss{animation:starMiss .4s ease forwards}
@keyframes starIn{0%{opacity:0;transform:scale(2.6) rotate(-30deg)}100%{opacity:1;transform:none}}
@keyframes starMiss{to{opacity:1;transform:none}}
.res-conds{display:flex;flex-direction:column;gap:4px;max-width:420px;margin:6px auto 0;font-size:13px}
.res-conds div{display:flex;justify-content:space-between;gap:10px;padding:5px 10px;border-radius:8px;background:rgba(255,255,255,.03)}
.res-conds .ok{color:var(--good)} .res-conds .no{color:var(--dim)}
.res-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0 0}
.res-stats div{background:rgba(255,255,255,.035);border:1px solid var(--edge);border-radius:10px;padding:8px;text-align:center}
.res-stats b{display:block;font-family:var(--font-d);font-size:17px}
.res-stats span{font-size:11px;color:var(--mute)}
.unlock{margin:16px auto 0;width:220px;perspective:800px}
.unlock .card{position:relative;height:150px;transform-style:preserve-3d;animation:flip .9s .9s cubic-bezier(.3,1.3,.4,1) both}
.unlock .face{position:absolute;inset:0;border-radius:14px;backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  border:1px solid rgba(255,194,71,.6)}
.unlock .back{background:repeating-linear-gradient(45deg,#1a2240 0 10px,#141b33 10px 20px);font-size:40px}
.unlock .front{transform:rotateY(180deg);background:radial-gradient(circle at 50% 30%,rgba(255,194,71,.28),rgba(10,16,30,.95) 70%);box-shadow:0 0 40px -8px var(--gold)}
.unlock .front canvas{width:60px;height:60px}
.unlock .front b{font-size:15px} .unlock .front span{font-size:11px;color:var(--gold);letter-spacing:.2em;font-family:var(--font-d)}
@keyframes flip{from{transform:rotateY(0)}to{transform:rotateY(180deg)}}

/* 증강 */
.augs{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:10px;perspective:900px}
.augs.four{grid-template-columns:repeat(4,1fr)}
.aug{position:relative;text-align:left;border-radius:14px;padding:16px 14px;border:1px solid var(--edge2);cursor:pointer;min-height:170px;
  background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.015));display:flex;flex-direction:column;gap:8px;overflow:hidden;
  animation:augIn .5s cubic-bezier(.2,1.25,.4,1) backwards;transition:transform .15s}
.aug:hover{transform:translateY(-4px)}
.aug:nth-child(2){animation-delay:.08s} .aug:nth-child(3){animation-delay:.16s} .aug:nth-child(4){animation-delay:.24s}

.aug .ar{font-family:var(--font-d);font-size:10px;letter-spacing:.24em;font-weight:800}
.aug .an{font-size:16px;font-weight:800}
.aug .ad{font-size:12.5px;color:var(--mute);line-height:1.55}
.aug.r1{border-color:rgba(185,198,255,.45)} .aug.r1 .ar{color:#b9c6ff}
.aug.r2{border-color:rgba(255,194,71,.6)} .aug.r2 .ar{color:var(--gold)}

.aug.r3::after{content:"";position:absolute;top:0;bottom:0;left:-60%;width:45%;background:linear-gradient(105deg,transparent,rgba(255,255,255,.18),transparent);
  transform:skewX(-18deg);animation:shine 3s .6s ease-in-out infinite;pointer-events:none}

/* 소개 카드 */
.intro{display:flex;gap:18px;align-items:center}

/* 대사 */
.talk{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);width:min(620px,calc(100% - 24px));z-index:30;display:flex;gap:12px;align-items:flex-start;

/* 기록 · 도감 · 설정 */
.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl th,.tbl td{padding:7px 8px;border-bottom:1px solid var(--edge);text-align:left}
.tbl th{color:var(--mute);font-weight:700;font-size:11.5px}
.tbl td.n{font-family:var(--font-d)}
.codex{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;margin-top:10px}
.cx{border:1px solid var(--edge);border-radius:12px;padding:10px;background:rgba(255,255,255,.025)}

/* 코치(튜토리얼) */
#coach{position:absolute;z-index:40;left:50%;transform:translateX(-50%);width:min(560px,calc(100% - 24px));top:64px;
  padding:13px 15px 11px;border-radius:14px;border:1px solid rgba(47,224,255,.55);background:linear-gradient(180deg,rgba(14,28,56,.97),rgba(7,13,28,.97));
  box-shadow:0 18px 50px -12px rgba(0,0,0,.75),0 0 36px -10px rgba(47,224,255,.5);animation:fadeIn .3s}
#coach.bot{top:auto;bottom:112px}

#coach .cd i.dn{background:rgba(47,224,255,.5)} #coach .cd i.on{background:var(--core);box-shadow:0 0 8px var(--core)}

.hl{animation:hlPulse 1.3s ease-in-out infinite!important}
@keyframes hlPulse{0%,100%{box-shadow:0 0 0 2px rgba(47,224,255,.95),0 0 0 6px rgba(47,224,255,.16)}50%{box-shadow:0 0 0 2px #2fe0ff,0 0 0 12px rgba(47,224,255,.04)}}

#toast{position:absolute;top:62px;left:50%;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
.tst{background:rgba(8,14,30,.95);border:1px solid var(--edge2);border-radius:99px;padding:7px 16px;font-size:13px;font-weight:700;animation:tst 2.6s ease forwards}
.tst.good{border-color:rgba(94,242,164,.6);color:#c9ffe4} .tst.bad{border-color:rgba(255,77,109,.6);color:#ffd0d8} .tst.gold{border-color:rgba(255,194,71,.7);color:#ffe9b3}
@keyframes tst{0%{opacity:0;transform:translateY(-8px)}10%,80%{opacity:1;transform:none}100%{opacity:0}}
#flash{position:absolute;inset:0;pointer-events:none;z-index:45;opacity:0}
#flash.go{animation:flashA .6s ease forwards}
@keyframes flashA{0%{opacity:.55}100%{opacity:0}}

/* ---------- 반응형 ---------- */

  .prep-body{grid-template-columns:1fr}

  .hud{height:44px;padding:3px 8px} .ro{padding:1px 8px;min-width:54px} .ro .v{font-size:14px} .hud-c{display:none}
  .dock{height:78px;padding:5px 8px} .scard2{width:72px} .scard2 canvas{width:30px;height:30px} .skbtn{width:62px} .callbox{width:108px}
  .t-btns{margin-top:18px} .t-line{display:none}
  .map-board{width:min(100%,calc((100dvh - 150px)*16/9))}
  .node{width:48px;height:48px;font-size:12px} .node.boss{width:60px;height:60px}
  .sheet{padding:14px 16px}
}
/* 폰 가로 화면: 상점·스킬·호출을 오른쪽 세로 막대로 옮겨 맵을 최대한 크게 */

  .dock.fold .shop,.dock.fold .skills,.dock.fold .callbox{display:flex}

  .shop{flex-wrap:wrap;overflow-y:auto;overflow-x:hidden;align-content:flex-start;flex:1;min-height:0}
  .scard2{width:calc(50% - 3px);height:56px}
  .scard2 canvas{width:26px;height:26px}
  .skills{gap:6px} .skbtn{flex:1;width:auto;height:52px}
  .callbox{width:100%;flex-direction:row;gap:5px} .btn.call{min-height:44px;flex:1} .callbox .btn.sm{min-height:44px}
  #coach{width:calc(100% - 200px);left:calc(50% - 88px)}
}
@media (max-width:620px){
  .hud-c{display:none} .ch-tab{min-width:0}
  .callbox{width:96px}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

<script>
/* ── 00-core.js ── */
'use strict';
/* ═══════════════════════════════════════════════════════════════
   네온 코어 디펜스: 오버로드
   파일 순서대로 이어 붙여 하나의 <script>가 된다 (build.py).
   ═══════════════════════════════════════════════════════════════ */
const W=1280, H=720, TILE=40, COLS=32, ROWS=18, TAU=Math.PI*2, FIX=1/60;
const DEBUG=/[?&]debug/.test(location.search);

const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const lerp=(a,b,t)=>a+(b-a)*t;
const rnd=(a,b)=>a+Math.random()*(b-a);
const d2=(ax,ay,bx,by)=>{ const dx=ax-bx, dy=ay-by; return dx*dx+dy*dy; };
const $=s=>document.querySelector(s);
const $$=s=>document.querySelectorAll(s);
const fmt=n=>Math.round(n).toLocaleString('ko-KR');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const angDiff=(a,b)=>{ let d=(a-b)%TAU; if(d>Math.PI) d-=TAU; if(d<-Math.PI) d+=TAU; return d; };
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function easeOut(t){ return 1-Math.pow(1-t,3); }
function easeInOut(t){ return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2; }

/* ═══════════ 저장 ═══════════
   기기(브라우저 저장소)에만 저장한다. 전작과 섞이지 않도록 다른 키를 쓴다. */
const SAVE={
 key:'ncd_overload_v1',
 d:null,
 fresh(){
  return {
   v:1,
   stars:{}, best:{}, hard:{},            // 스테이지별 별 · 최고 기록(초) · 하드 클리어
   cleared:{},                            // 처음 클리어한 스테이지
   seenEnemy:{}, seenBoss:{}, seenTalk:{},
   loadout:{towers:[],skills:[]},
   chaos:[],                              // 아수라장 상위 10판
   chaosMap:'1-1',
   losses:{},                             // 스테이지별 연속 패배
   stats:{time:0,kills:0,games:0,use:{},evo:{}},
   tut:false,
   set:{mus:.7,sfx:.8,fx:'auto'}
  };
 },
 load(){
  let d=null;
  try{ d=JSON.parse(localStorage.getItem(this.key)||'null'); }catch(e){ d=null; }
  const f=this.fresh();
  if(!d||typeof d!=='object') d=f;
  for(const k in f) if(d[k]===undefined) d[k]=f[k];
  for(const k in f.set) if(d.set[k]===undefined) d.set[k]=f.set[k];
  for(const k in f.stats) if(d.stats[k]===undefined) d.stats[k]=f.stats[k];
  this.d=d;
  return d;
 },
 save(){ try{ localStorage.setItem(this.key,JSON.stringify(this.d)); }catch(e){} },
 reset(){ this.d=this.fresh(); this.save(); }
};
SAVE.load();

/* 해금 여부는 클리어 기록에서 계산한다 — 저장 형식이 단순해진다 */
function isCleared(id){ return !!SAVE.d.cleared[id]; }
function totalStars(){ let n=0; for(const k in SAVE.d.stars) n+=SAVE.d.stars[k]; return n; }

/* 간단한 화면 알림 */
function toast(msg,kind){
 const el=document.createElement('div');
 el.className='tst'+(kind?' '+kind:'');
 el.innerHTML=msg;
 $('#toast').appendChild(el);
 setTimeout(()=>el.remove(),2700);
}
function screenFlash(col){
 const f=$('#flash');
 f.style.background='radial-gradient(circle at 50% 50%,'+col+',transparent 65%)';
 f.classList.remove('go'); void f.offsetWidth; f.classList.add('go');
}

/* ── 01-audio.js ── */
/* ═══════════ 사운드 ═══════════

const SND={
 ctx:null,master:null,comp:null,gSfx:null,gMus:null,verb:null,send:null,noise:null,
 on:true,ready:false,voices:0,last:Object.create(null),
 init(){
  if(this.ctx) return;
  const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
  try{
   const c=new AC(); this.ctx=c;
   this.comp=c.createDynamicsCompressor();
   this.comp.threshold.value=-10; this.comp.knee.value=8; this.comp.ratio.value=12;
   this.comp.attack.value=.003; this.comp.release.value=.2;
   this.comp.connect(c.destination);
   this.master=c.createGain(); this.master.gain.value=.9; this.master.connect(this.comp);
   this.gSfx=c.createGain(); this.gSfx.connect(this.master);
   this.gMus=c.createGain(); this.gMus.gain.value=0; this.gMus.connect(this.master);
   this.musFilter=c.createBiquadFilter(); this.musFilter.type='lowpass'; this.musFilter.frequency.value=12000;
   this.musFilter.connect(this.gMus);
   this.verb=c.createConvolver(); this.verb.buffer=this.mkIR(1.9,2.6);
   const vg=c.createGain(); vg.gain.value=.8; this.verb.connect(vg); vg.connect(this.master);
   this.send=c.createGain(); this.send.connect(this.verb);
   this.musSend=c.createGain(); this.musSend.gain.value=.35; this.musSend.connect(this.verb);
   const len=(c.sampleRate*1.6)|0, b=c.createBuffer(1,len,c.sampleRate), d=b.getChannelData(0);
   for(let i=0;i<len;i++) d[i]=Math.random()*2-1;
   this.noise=b;
   this.ready=true;
   this.applyVol();
  }catch(e){ this.ready=false; }
 },
 mkIR(dur,decay){
  const c=this.ctx, n=(c.sampleRate*dur)|0, buf=c.createBuffer(2,n,c.sampleRate);
  for(let ch=0;ch<2;ch++){
   const d=buf.getChannelData(ch); let lp=0;
   for(let i=0;i<n;i++){ const v=(Math.random()*2-1)*Math.pow(1-i/n,decay); lp+=(v-lp)*.35; d[i]=lp; }
  }
  return buf;
 },
 applyVol(){
  if(!this.ready) return;
  const s=SAVE.d.set, t=this.ctx.currentTime;
  this.gSfx.gain.setTargetAtTime(.55*s.sfx,t,.05);
  this.on=s.sfx>0.001;
  if(this.mTheme) this.gMus.gain.setTargetAtTime(.38*s.mus,t,.3);
 },
 resume(){ if(this.ctx&&this.ctx.state==='suspended') this.ctx.resume().catch(()=>{}); },
 /* 화면이 가려지거나 일시정지하면 오디오 클록 자체를 멈춘다 */
 pauseAll(){ if(this.ctx&&this.ctx.state==='running') this.ctx.suspend().catch(()=>{}); },
 resumeAll(){ if(this.ctx&&this.ctx.state==='suspended') this.ctx.resume().catch(()=>{}); },
 /* 탭을 닫을 때: 연결을 먼저 끊어(동기) 스피커로 가는 길을 막고 컨텍스트를 닫는다 */
 hardStop(){
  try{ if(this.mp3Src){ this.mp3Src.stop(); this.mp3Src.disconnect(); } }catch(e){}
  try{ if(this.master){ this.master.gain.value=0; this.master.disconnect(); } }catch(e){}
  try{ if(this.comp) this.comp.disconnect(); }catch(e){}
  try{ if(this.ctx) this.ctx.close(); }catch(e){}
  if(this.mTimer){ clearInterval(this.mTimer); this.mTimer=null; }
  this.ctx=null; this.ready=false;
 },
 busy(){ return this.voices>28; },

 tone(o){
  if(!this.ready||!this.on||this.busy()) return;
  const c=this.ctx, t=c.currentTime+(o.at||0);
  const osc=c.createOscillator(), g=c.createGain();
  osc.type=o.type||'sine';
  osc.frequency.setValueAtTime(o.f,t);
  if(o.f2) osc.frequency.exponentialRampToValueAtTime(Math.max(20,o.f2),t+o.d);
  if(o.detune) osc.detune.value=o.detune;

  if(this.mp3Src){ try{ this.mp3Src.stop(); }catch(e){} this.mp3Src.disconnect(); this.mp3Src=null; }

  const c=this.ctx;
  const go=()=>{
   if(this.mTheme!=='ch1'||this.mp3Src) return;
   const s=c.createBufferSource(); s.buffer=this.mp3Buf; s.loop=true;
   s.connect(this.musFilter); s.start(0); this.mp3Src=s;
  };
  if(this.mp3Buf){ go(); return; }
  if(this.mp3Loading) return;
  this.mp3Loading=true;
  fetch(MUSIC_MP3).then(r=>r.arrayBuffer()).then(b=>c.decodeAudioData(b)).then(ab=>{ this.mp3Buf=ab; this.mp3Loading=false; go(); })
   .catch(()=>{ this.mp3Loading=false; });

  gn.gain.exponentialRampToValueAtTime(.0001,t+d);

   }

const TOWER_IDS=Object.keys(TOWERS);
const START_TOWERS=['pulse','sniper','mortar','cryo','amp'];

/* 탑 하나의 현재 기본 수치(레벨·진화 합산). 증강·오라는 전투 코드에서 더한다. */
function towerBase(id,lv,evo){
 const D=TOWERS[id], o={};
 for(let i=0;i<=lv;i++) Object.assign(o,D.lv[i]);
 if(evo) Object.assign(o,D.evo[evo]);
 return o;
}
function upCost(t){
 const D=TOWERS[t.id]; let c;
 if(t.lv<2) c=D.cost*(t.lv===0?1:2);
 else c=D.cost*3;
 if(t.lv<2) c*=(1-(G.aug.upg_discount?.3:0))*(G.aug.midas?2:1)*(G.aug.all_evo?2:1);
 else c*=(1-(G.aug.evo_discount?.4:0))*(G.aug.all_evo?0:1);
 return Math.round(c);
}
function buildCost(id){
 let c=TOWERS[id].cost;
 if(G.aug.tower_cheap) c*=.5;
 if(G.aug.blood_price) c*=.5;
 return Math.round(c);
}

const CH_HP=[1,1.85,3.1], CH_GOLD=[1,1.5,2.05], CH_START=[260,450,680];
function waveHpMul(st,w){ return CH_HP[st.ch]*(1+.05*(st.idx%6))*(1+.1*(w-1)+.006*(w-1)*(w-1)); }
/* 적마다 위협도(비용)를 매기고, 웨이브마다 정해진 예산 안에서
   싼 적(물량)과 특수 적(소수)을 섞는다 — 특수 적이 한꺼번에 몰리는 일이 없다. */
const DENS=1.35;   /* 한 웨이브의 적 수 배율. 적 하나의 체력·보상은 1/DENS 라서 총량은 같다 */
const THREAT={drone:1,swift:.8,brute:3,flyer:1.5,splitter:2.2,healer:3.5,shield:2.2,phase:2,blinker:1.6,sapper:3.5,stealth:2,bearer:3,berserk:2.5,carrier:5,shard:.5};
function buildWaves(st){
 const P=st.pool, N=st.waves, out=[];
 /* 물량은 항상 땅으로 오는 적 — 비행체만 몰려오는 웨이브가 생기지 않게 */
 const fod=P.filter(t=>THREAT[t]<=1.6&&!ENEMIES[t].air); if(!fod.length) fod.push('drone','swift');
 const spec=P.filter(t=>fod.indexOf(t)<0&&t!==st.intro);
 for(let w=1;w<=N;w++){
  const B=(9+w*3.2)*(1+.12*st.ch)*(1+.04*(st.idx%6));
  const g=[], fShare=spec.length||st.intro?.58:1;
  const f1=fod[(w-1)%fod.length], f2=fod[w%fod.length];
  if(f2!==f1&&w>=3){
   g.push([f1,Math.max(3,Math.round(B*fShare*.6/THREAT[f1])),Math.max(.34,.85-w*.04),0]);
   g.push([f2,Math.max(2,Math.round(B*fShare*.4/THREAT[f2])),.7,3]);
  } else g.push([f1,Math.max(4,Math.round(B*fShare/THREAT[f1])),Math.max(.34,.85-w*.04),0]);
  const ns=spec.length?(w>=5?2:(w>=2?1:0)):0;
  for(let i=0;i<ns;i++){
   const t=spec[(w+i*2)%spec.length];
   g.push([t,Math.max(1,Math.round(B*(1-fShare)*.75/ns/THREAT[t])),1.15,2+i*3]);
  }
  if(st.intro&&w>=2) g.push([st.intro,Math.max(1,Math.round(B*(1-fShare)*(ns?.35:.8)/THREAT[st.intro])),1.3,4.5]);
  if(w===N&&!st.boss) g.push([fod[0],Math.round(B*.35/THREAT[fod[0]]),.4,8]);
  out.push(g);
 }
 for(const wv of out) for(const g of wv){ g[1]=Math.max(1,Math.round(g[1]*DENS)); g[2]=g[2]*.82; }
 if(st.boss){
  const B=(9+N*3.2)*(1+.12*st.ch);
  const g=[[st.boss,1,1,3],[fod[0],Math.round(B*.4/THREAT[fod[0]]),.7,0]];
  if(spec.length) g.push([spec[0],Math.max(2,Math.round(B*.2/THREAT[spec[0]])),1.2,10]);
  if(spec.length>1) g.push([spec[1],Math.max(2,Math.round(B*.2/THREAT[spec[1]])),1.2,18]);
  out.push(g);
 }
 return out;
}

const CHAOS_POOL=['drone','swift','brute','flyer','splitter','healer','shield','phase','blinker','sapper','stealth','bearer','berserk','carrier'];
function chaosWave(n){
 const out=[], avail=CHAOS_POOL.slice(0,Math.min(CHAOS_POOL.length,3+Math.floor(n/2)));
 const cnt=Math.round((7+n*1.1)*DENS);
 out.push([avail[(n*3)%avail.length],cnt,Math.max(.22,.8-n*.012),0]);
 out.push([avail[(n*5+1)%avail.length],Math.round(cnt*.5),.8,3]);
 if(n>=5) out.push([avail[(n*7+2)%avail.length],Math.round(cnt*.35),.9,6]);
 if(n%10===0){ const b=['crusher','hive','overlord'][(n/10-1)%3]; out.unshift([b,1,1,2]); }
 return out;
}

/* ── 경로 ── */
function makePath(pts){
 const P={pts:pts.map(([x,y])=>({x:x*TILE+TILE/2,y:y*TILE+TILE/2})),segs:[],total:0};
 for(let i=0;i<P.pts.length-1;i++){
  const a=P.pts[i], b=P.pts[i+1], len=Math.hypot(b.x-a.x,b.y-a.y);
  P.segs.push({a:a,b:b,len:len,ux:(b.x-a.x)/len,uy:(b.y-a.y)/len,s:P.total});
  P.total+=len;
 }
 P.core=P.pts[P.pts.length-1];
 P.gate=P.pts[0];
 /* 공중 경로: 관문에서 코어로 곧장 */
 P.airLen=Math.hypot(P.core.x-P.gate.x,P.core.y-P.gate.y);
 /* 길이가 제각각인 맵에서도 적이 건너는 시간이 비슷하도록 속도를 맞춘다 */
 P.spdMul=clamp(Math.pow(P.total/2000,.6),.72,1.9);
 P.airMul=clamp(Math.pow(P.airLen/1100,.4),.8,1.3);
 return P;
}
function ptAt(lane,d){
 const P=G.paths[lane]||G.paths[0], n=P.segs.length; d=clamp(d,0,P.total);
 for(let i=0;i<n;i++){ const s=P.segs[i];
  if(d<=s.s+s.len||i===n-1){ const k=d-s.s; return {x:s.a.x+s.ux*k,y:s.a.y+s.uy*k,ang:Math.atan2(s.uy,s.ux)}; } }
 return {x:P.core.x,y:P.core.y,ang:0};
}
function airAt(lane,d){
 const P=G.paths[lane]||G.paths[0], k=clamp(d/P.airLen,0,1);
 return {x:lerp(P.gate.x,P.core.x,k),y:lerp(P.gate.y,P.core.y,k),ang:Math.atan2(P.core.y-P.gate.y,P.core.x-P.gate.x)};
}
const inGrid=(tx,ty)=>tx>=0&&ty>=0&&tx<COLS&&ty<ROWS;
const tkey=(tx,ty)=>tx+','+ty;
function isBlocked(tx,ty){ for(const b of G.blocked) if(b.tx===tx&&b.ty===ty) return true; return false; }
function buildable(tx,ty){
 if(!inGrid(tx,ty)) return false;
 const k=tkey(tx,ty);
 if(G.pathTiles.has(k)&&!G.pathBuild.has(k)) return false;
 if(G.occ[ty*COLS+tx]) return false;
 if(isBlocked(tx,ty)) return false;
 const c=G.paths[0].core; if(Math.abs(c.x-(tx+.5)*TILE)<TILE&&Math.abs(c.y-(ty+.5)*TILE)<TILE) return false;
 return true;
}

/* ── 맵 만들기: 경로 · 지형 ── */
function buildMap(lay,mirror,terr,seed){
 G.paths=layoutPaths(lay,mirror).map(makePath);
 G.pathTiles=new Set(); G.pathBuild=new Set();
 for(const P of G.paths){
  for(const s of P.segs){
   const steps=Math.ceil(s.len/(TILE/2));
   for(let i=0;i<=steps;i++){
    const x=s.a.x+s.ux*s.len*i/steps, y=s.a.y+s.uy*s.len*i/steps;
    const tx=Math.floor(x/TILE), ty=Math.floor(y/TILE);
    if(inGrid(tx,ty)) G.pathTiles.add(tkey(tx,ty));
   }
  }
 }
 G.occ=new Array(COLS*ROWS).fill(null);
 G.energy=new Set(); G.coolant=new Set(); G.pads=[]; G.em=[]; G.blocked=[]; G.moving=[]; G.movingPool=[];
 const rng=mulberry32(seed*9301+49297);
 const pts=[...G.pathTiles].map(k=>k.split(',').map(Number));
 const cov=(tx,ty)=>{ let c=0; for(const p of pts){ const dx=p[0]-tx, dy=p[1]-ty; if(dx*dx+dy*dy<=9) c++; } return c; };
 const cands=[];
 for(let ty=0;ty<ROWS;ty++) for(let tx=0;tx<COLS;tx++) if(buildable(tx,ty)) cands.push({tx:tx,ty:ty,c:cov(tx,ty)});
 cands.sort((a,b)=>b.c-a.c);
 const used=[];
 const far=(k,d)=>used.every(u=>Math.max(Math.abs(u.tx-k.tx),Math.abs(u.ty-k.ty))>=d);
 const pick=(n,dist,top)=>{
  const out=[], pool=cands.slice(0,Math.max(6,Math.floor(cands.length*top)));
  for(let tries=0;tries<400&&out.length<n;tries++){
   const k=pool[Math.floor(rng()*pool.length)];
   if(!k||!far(k,dist)) continue;
   out.push(k); used.push(k);
  }
  return out;
 };
 /* 장식 장애물: 길에서 먼 칸 몇 개 */
 const lows=cands.filter(k=>k.c<=1&&k.tx>0&&k.ty>0&&k.tx<COLS-1&&k.ty<ROWS-1);
 for(let i=0;i<9&&lows.length;i++){
  const k=lows.splice(Math.floor(rng()*lows.length),1)[0];
  if(far(k,2)){ G.blocked.push({tx:k.tx,ty:k.ty,v:Math.floor(rng()*4)}); used.push(k); }
 }
 terr=terr||{};
 if(terr.energy) for(const k of pick(terr.energy,4,.3)) G.energy.add(tkey(k.tx,k.ty));
 if(terr.coolant) for(const k of pick(terr.coolant,3,.35)) G.coolant.add(tkey(k.tx,k.ty));
 if(terr.em) for(const k of pick(terr.em,5,.25)) G.em.push({tx:k.tx,ty:k.ty});
 if(terr.moving){ G.movingPool=pick(10,3,.35); G.movingN=terr.moving; }
 if(terr.pads){
  const P=G.paths[0];
  for(let i=0;i<terr.pads;i++){
   const d=P.total*(.28+.5*i/Math.max(1,terr.pads-1));
   const p=ptAt(0,d); G.pads.push({x:p.x,y:p.y,ang:p.ang});
  }
 }
 G.terr=terr;
 G.blackout=-1;
}
function rollMoving(){
 if(!G.movingPool||!G.movingPool.length) return;
 G.moving=[];
 const n=G.movingPool.length;
 for(let i=0;i<G.movingN;i++){ const k=G.movingPool[(G.wave*2+i*3)%n]; G.moving.push(tkey(k.tx,k.ty)); }
 G.buffsDirty=true;
}
function isEnergy(tx,ty){ const k=tkey(tx,ty); return G.energy.has(k)||G.moving.indexOf(k)>=0; }
function inEm(tx,ty){ for(const z of G.em) if(Math.abs(z.tx-tx)<=1&&Math.abs(z.ty-ty)<=1) return true; return false; }

/* ═══════════ 방어탑 ═══════════ */
function makeTower(id,tx,ty){
 const t={id:id,D:TOWERS[id],tx:tx,ty:ty,x:(tx+.5)*TILE,y:(ty+.5)*TILE,lv:0,evo:null,evo2:false,
  spent:0,ang:-Math.PI/2,recoil:0,spin:0,mode:'first',kills:0,dmgDone:0,born:G.time,jam:0,shots:0,
  buf:{dmg:0,rate:0,crit:0,cmul:0,rng:0,near:0},wep:[],ghost:false,ghostT:0,flash:0};

}
/* 진화 갈래마다 '무기'를 하나씩 — 이중 진화면 두 무기가 각자 쏜다 */
function rebuildWeapons(t){
 const old=t.wep||[];
 const keys=t.evo?(t.evo2?['A','B']:[t.evo]):[null];
 t.wep=keys.map((k,i)=>{
  const s=towerBase(t.id,t.lv,k);
  const o=old[i]||{};
  return {key:k,s:s,cd:o.cd||rnd(0,.3),lock:null,lockT:0,spin:0,cnt:0,beams:[],_sf:-1,_m:null};
 });
 if(t.id==='amp'&&G.aug.amp_self) t.wep.push({key:'self',s:{kind:'bullet',dmg:14,rate:1.6,rng:120},cd:0,lock:null,lockT:0,spin:0,cnt:0,beams:[],_sf:-1});

}
function evoCol(t){ return t.evo?(t.evo2?'#ffffff':TOWERS[t.id].evo[t.evo].col):TOWERS[t.id].col; }
function towerName(t){ return t.evo?(t.evo2?TOWERS[t.id].evo.A.n+' + '+TOWERS[t.id].evo.B.n:TOWERS[t.id].evo[t.evo].n):TOWERS[t.id].n; }

/* 지원 탑 오라 · 지형 · 공명 — 탑 구성이 바뀔 때만 다시 계산 */
function refreshAuras(){
 G.buffsDirty=false;
 const ts=G.towers.concat(G.ghosts);
 for(const t of ts){
  t.buf={dmg:0,rate:0,crit:0,cmul:0,rng:0,near:0};
  t.onEnergy=isEnergy(t.tx,t.ty); t.onCool=G.coolant.has(tkey(t.tx,t.ty)); t.inEm=inEm(t.tx,t.ty);
 }
 const supMul=G.aug.role_sup?1.5:1;
 for(const a of G.towers){
  if(a.jam>G.time) continue;
  for(const w of a.wep){
   if(w.s.kind!=='aura') continue;
   let R=w.s.rng*supMul*(a.id==='amp'&&G.aug.amp_range?1.5:1)*(a.id==='radar'&&G.aug.radar_far?1.5:1);
   const r2=R*R;
   for(const t of ts){
    if(t===a||d2(a.x,a.y,t.x,t.y)>r2) continue;
    t.buf.dmg+=w.s.aDmg||0; t.buf.rate+=w.s.aRate||0; t.buf.crit+=w.s.aCrit||0; t.buf.cmul+=w.s.aCritMul||0; t.buf.rng+=w.s.aRng||0;
   }
  }
 }
 if(G.aug.tower_aura){
  for(const t of ts) for(const o of ts){ if(o!==t&&Math.abs(o.tx-t.tx)<=2&&Math.abs(o.ty-t.ty)<=2) t.buf.dmg+=.1; }
 }
 for(const t of ts){
  let n=0; for(const o of G.towers) if(o!==t&&Math.abs(o.tx-t.tx)<=2&&Math.abs(o.ty-t.ty)<=2) n++;
  t.buf.near=n;
  t.buf.dmg=Math.min(t.buf.dmg,2.5); t.buf.rate=Math.min(t.buf.rate,1.6); t.buf.crit=Math.min(t.buf.crit,.75);
 }
 G.kinds={}; for(const t of G.towers) G.kinds[t.id]=(G.kinds[t.id]||0)+1;
}

/* 탑 하나에 걸리는 배율(프레임마다 한 번만 계산) */
function towerMods(t){
 if(t._mf===G.frame) return t._m;
 const A=G.aug, role=t.D.role;
 let dm=1+t.buf.dmg, rm=1+t.buf.rate, gm=1+t.buf.rng, crit=t.buf.crit, cmul=2+t.buf.cmul;
 if(t.onEnergy) dm+=A.energy_power?.6:.2;
 if(t.inEm) gm-=.2;
 if(G.blackout>=0&&((t.x<W/2)===(G.blackout===0))) dm*=.7;
 if(G.overclockT>0) rm*=2;
 if(G.firstStrikeT>0) dm*=2;
 if(A.last_stand&&G.lives<=5) dm*=2;
 if(A.overlord_heart) dm*=3;
 if(A.glass){ dm*=2; gm-=.3; }
 if(A.pacifist) dm*=3.5;
 if(A.economy) dm*=.75;
 if(A.tower_cheap) dm*=.8;
 if(A.gamble) dm*=G.gambleMul;
 if(A.chrono) rm*=1.5;
 if(A.range_all) gm+=.15;
 if(A.second_core) gm-=.15;
 if(A.boss_magnet&&G.bosses.length) gm+=.4;
 if(A.crit_all) crit+=.1;
 if(A.crit_mega){ crit+=.25; cmul=Math.max(cmul,3); }
 if(A.role_direct){ if(role==='direct') rm*=1.4; else dm*=.9; }
 if(A.monoculture&&A.monoculture===t.id) dm*=4;
 if(A.swarm_mind) dm*=1+.15*((G.kinds&&G.kinds[t.id])||1);
 if(A.diversity&&G.kinds) dm*=1+.1*Object.keys(G.kinds).length;
 if(A.energy_dmg) dm*=1+Math.min(1,.2*Math.floor(G.gold/1000));
 if(A.kill_rate) rm*=1+Math.min(1,G.killRate);
 if(t.id==='sniper'&&A.sniper_lonely&&t.buf.near===0) dm*=2;
 const m={dm:dm,rm:Math.max(.2,rm),gm:Math.max(.4,gm),crit:crit,cmul:cmul};
 t._mf=G.frame; t._m=m;
 return m;
}
/* 무기의 실제 수치 */
function S(t,w){
 if(w._sf===G.frame) return w._x;
 const m=towerMods(t), s=w.s, x=Object.assign({},s);
 if(s.dmg) x.dmg=s.dmg*m.dm;
 if(s.dps) x.dps=s.dps*m.dm;
 if(s.rate) x.rate=s.rate*m.rm;
 x.rng=(s.rng||0)*m.gm;
 x.crit=m.crit; x.cmul=m.cmul;
 /* 탑별 증강 */
 const A=G.aug;
 if(t.id==='mortar'&&A.mortar_rapid){ x.rate*=1.6; x.splash*=.75; }
 if(t.D.role==='blast'&&A.role_blast&&x.splash) x.splash*=1.4;
 if(t.id==='plasma'&&A.plasma_big&&x.splash) x.splash*=1.5;
 if(t.id==='ricochet'&&A.rico_more&&x.bounce){ x.bounce+=3; x.dmg*=.8; }
 if(t.id==='arc'&&A.arc_air&&x.chains) x.chains+=2;
 if(t.id==='cryo'&&A.cryo_wide){ if(x.splash) x.splash*=1.6; if(x.kind==='froststorm') x.rng*=1.6; }
 if(t.id==='flame'&&A.flame_long) x.rng*=1.4;
 if(t.id==='grav'&&A.grav_wide) x.rng*=1.4;
 if(t.id==='mines'&&A.mine_rain){ x.max*=2; x.rate*=1.4; }
 if(t.id==='venom'&&A.venom_stack) x.stack=5;
 if(t.id==='laser'&&A.laser_quick&&x.rup) x.rup*=.5;
 if(t.id==='marker'&&A.mark_long) x.markT*=2;
 if(t.onCool&&(t.id==='cryo')){ if(x.slow) x.slow=Math.min(.85,x.slow*1.4); if(x.slowT) x.slowT*=2; if(x.freezeT) x.freezeT*=2; if(x.dmg) x.dmg*=2; if(x.dps) x.dps*=2; }
 if(A.role_elem&&t.D.role==='elem'){ if(x.slowT) x.slowT*=2; if(x.dotT) x.dotT*=2; if(x.freezeT) x.freezeT*=2; }
 w._sf=G.frame; w._x=x;
 return x;
}

function canBuildType(id){
 if(G.loadout.indexOf(id)<0) return '데려오지 않은 탑입니다';

function upgradeTower(t,branch){

/* ═══════════ 대상 찾기 ═══════════ */
function canSee(e){ return e.vis; }
function canHit(t,x,e){
 if(!e.alive||!e.vis||e.invuln>0) return false;
 if(e.air&&!t.D.air) return false;
 return true;
}
function findTargets(t,x,n,modeOverride){
 const r2=x.rng*x.rng, list=[];
 for(const e of G.enemies){ if(canHit(t,x,e)&&d2(t.x,t.y,e.x,e.y)<=r2) list.push(e); }
 if(list.length<=1) return list;
 const mode=modeOverride||t.mode;
 if(mode==='first') list.sort((a,b)=>b.prog-a.prog);
 else if(mode==='last') list.sort((a,b)=>a.prog-b.prog);
 else if(mode==='strong') list.sort((a,b)=>(b.hp+b.shield)-(a.hp+a.shield));
 else list.sort((a,b)=>d2(t.x,t.y,a.x,a.y)-d2(t.x,t.y,b.x,b.y));
 return n?list.slice(0,n):list;
}
function findTarget(t,x,mode){ return findTargets(t,x,1,mode)[0]||null; }
function nearestEnemy(x,y,r,skip,air){
 let best=null, bd=r*r;
 for(const e of G.enemies){
  if(!e.alive||!e.vis||(skip&&skip.indexOf(e)>=0)) continue;
  if(e.air&&air===false) continue;
  const dd=d2(x,y,e.x,e.y); if(dd<bd){ bd=dd; best=e; }
 }
 return best;
}
function aim(t,e){ t.ang=Math.atan2(e.y-t.y,e.x-t.x); }

/* ═══════════ 피해 ═══════════ */
function hurt(e,amount,o){
 o=o||{};
 if(!e.alive||amount<=0||e.invuln>0) return 0;
 const A=G.aug, src=o.src;
 let dmg=amount, crit=false;
 if(src&&!o.nocrit&&o.kind!=='dot'&&o.crit>0&&Math.random()<o.crit){ crit=true; dmg*=o.cmul||2; }
 let mul=1;
 if(e.D.dr) mul*=1-e.D.dr;
 if(e.markT>0) mul+=e.markV;
 if(A.cryo_shatter&&e.freeze>0) mul+=.5;
 if(A.role_ctrl&&(e.freeze>0||e.stun>0||e.root>0)) mul+=.3;
 if(A.air_def&&e.air) mul+=.5;
 if(A.radar_mark&&e.radarMk) mul+=.1;
 if(A.boss_hunter) mul*=e.D.boss?2:.8;
 /* 보스 약점: 약점 쪽에서 날아온 공격은 2배 */
 if(e.D.giant&&o.from){
  const a=Math.atan2(o.from.y-e.y,o.from.x-e.x);
  if(Math.abs(angDiff(a,e.wpAng))<.9){ mul*=2; e.wpHit=.15; }
 }
 /* 방패병: 앞에서 오는 단일 공격을 막는다 */
 if(e.D.front&&o.kind==='hit'&&o.from){
  const a=Math.atan2(o.from.y-e.y,o.from.x-e.x);
  if(Math.abs(angDiff(a,e.ang))<1.05){ mul*=1-e.D.front; e.blockT=.12; }
 }
 dmg*=mul;
 if(o.kind!=='dot'&&o.kind!=='true'){
  let ar=e.armor-(e.shred||0)-(e.crack||0);
  ar*=(1-(o.pen||0))*(A.armor_break?.5:1);
  if(ar>0) dmg=Math.max(dmg*.15,dmg-ar);
 }
 if(A.giant_slayer&&src&&(o.kind==='hit'||o.kind==='splash')&&!o.aug) dmg+=e.maxHp*(e.D.boss?.005:.03);
 if(A.exec_all&&!e.D.boss&&e.hp-dmg<=e.maxHp*.1&&e.hp-dmg>0){ dmg=e.hp+e.shield+1; o.ignoreShield=true; say(e.x,e.y-e.r-6,'처형','#ff4fd8',13); }
 if(e.shield>0&&!o.ignoreShield){
  const sb=(A.shield_break?3:1);
  const take=Math.min(e.shield,dmg*sb);
  e.shield-=take; dmg-=take/sb;
  if(e.D.shield) e.shieldT=e.D.shield.delay;
  if(e.shield<=0){ ring(e.x,e.y,e.r+10,'#ffe066',.35,2); SND.play('shieldbreak',90); }
 }
 if(dmg<=0) return 0;
 e.hp-=dmg; e.hitT=.1;
 G.stats.dealt+=dmg;
 if(src){ src.dmgDone+=dmg; }
 if(!o.silent&&(dmg>=24||crit)) say(e.x+rnd(-5,5),e.y-e.r-4,Math.round(dmg),crit?'#ffd34d':'#eaf4ff',crit?15:11);
 if(A.echo&&src&&o.kind==='hit'&&!o.aug) G.echoQ.push({e:e,d:dmg*.2,t:.5,src:src});
 if(e.hp<=0) kill(e,src,o);
 return dmg;
}
/* 단일 명중에 붙는 공통 증강 */
function hitAugs(e,dmg,src,from){
 const A=G.aug;
 if(A.splash_all) splash(e.x,e.y,32,dmg*.3,src,{aug:true,silent:true,air:true});
 if(A.dot_all&&e.alive) poison(e,dmg*.1,2,src,1,'all');
 if(A.slow_all&&e.alive) slowE(e,.15,1);
 if(A.ricochet_all&&e.alive){
  const n=nearestEnemy(e.x,e.y,110,[e]);
  if(n){ beamFx(e.x,e.y,n.x,n.y,'#c3ff6b',.12,1.5); hurt(n,dmg*.6,{src:src,kind:'hit',aug:true,silent:true}); }
 }
}
function splash(x,y,r,dmg,src,o){
 o=o||{};
 const r2=r*r; let n=0;
 for(const e of G.enemies){
  if(!e.alive||(e.air&&!o.air)) continue;
  if(d2(x,y,e.x,e.y)<=r2+e.r*e.r){ hurt(e,dmg,{src:src,kind:'splash',pen:o.pen,aug:o.aug,silent:o.silent,from:{x:x,y:y},crit:o.crit,cmul:o.cmul}); n++;
   if(o.stun&&e.alive) stunE(e,o.stun); if(o.freeze&&e.alive) freezeE(e,o.freeze); }
 }

}

/* ── 상태 이상 ── */
function slowE(e,amt,t){
 if(e.D.noSlow) return;
 if(amt>=e.slow||e.slowT<=0){ e.slow=Math.max(e.slow,amt); }
 e.slowT=Math.max(e.slowT,t);

function sonicWave(t,x){

  if(!canHit(t,x,e)||d2(t.x,t.y,e.x,e.y)>r2) continue;

function mineSpots(t,rng){

 G.paths.forEach((P,lane)=>{ for(let d=0;d<P.total;d+=18){ const p=ptAt(lane,d); if(d2(t.x,t.y,p.x,p.y)<=r2) out.push({x:p.x,y:p.y,lane:lane,dist:d}); } });

function distSeg(px,py,ax,ay,bx,by){
 const dx=bx-ax, dy=by-ay, l2=dx*dx+dy*dy;
 let k=l2?((px-ax)*dx+(py-ay)*dy)/l2:0; k=clamp(k,0,1);
 return Math.hypot(px-(ax+dx*k),py-(ay+dy*k));
}

/* 계속 쏘는 무기 (광선 · 화염 · 오라) */
function continuous(t,w,dt){

  const n=k==='splitbeam'?x.beams:1;

   for(const e of findTargets(t,x,0)){ if(w.beams.length>=n) break; if(!w.beams.some(b=>b.e===e)) w.beams.push({e:e,t:0}); }
  }
  if(!w.beams.length) return;
  aim(t,w.beams[0].e);
  for(const b of w.beams){
   b.t=Math.min(x.rup,b.t+dt);
   const ramp=1+(x.ramp-1)*(b.t/x.rup);
   hurt(b.e,x.dps*ramp*dt,{src:t,kind:'beam',silent:true,nocrit:true,from:{x:t.x,y:t.y}});
   if(A.laser_burn&&b.e.alive){ b.bt=(b.bt||0)-dt; if(b.bt<=0){ b.bt=.5; poison(b.e,x.dps*.25,2,t,1,'burn'); } }
  }

  return;
 }
 if(k==='flame'){
  const tg=findTarget(t,x,'close');

  const r2=x.rng*x.rng;
  for(const e of G.enemies){
   if(!e.alive||e.air||!e.vis||d2(t.x,t.y,e.x,e.y)>r2) continue;
   if(Math.abs(angDiff(Math.atan2(e.y-t.y,e.x-t.x),t.ang))>x.cone) continue;
   let d=x.dps*dt;
   if(x.furnace) d*=1+(1-Math.sqrt(d2(t.x,t.y,e.x,e.y))/x.rng);
   hurt(e,d,{src:t,kind:'beam',silent:true,nocrit:true});

  }

  }

 }
 if(k==='storm'||k==='froststorm'||k==='timewarp'){

   if(e.air&&!t.D.air) continue;
   if(x.dps) hurt(e,x.dps*dt,{src:t,kind:k==='storm'?'beam':'dot',silent:true,nocrit:true});
   if(x.slow&&e.alive&&!e.D.noSlow) e.auraSlow=Math.max(e.auraSlow,e.D.boss?x.slow*.5:x.slow);
  }
  if(k==='storm'&&Math.random()<dt*6){
   const e=nearestEnemy(t.x+rnd(-x.rng,x.rng),t.y+rnd(-x.rng,x.rng),x.rng);
   if(e&&d2(t.x,t.y,e.x,e.y)<=r2) boltFx([{x:t.x,y:t.y-10},{x:(t.x+e.x)/2+rnd(-12,12),y:(t.y+e.y)/2+rnd(-12,12)},{x:e.x,y:e.y}],evoCol(t),.14);
   if(Math.random()<.3) SND.play('arc',250);
  }
 }
}

const PASSIVE_KINDS={aura:1,income:1,core:1};

function updateTowers(dt){
 const list=G.ghosts.length?G.towers.concat(G.ghosts):G.towers;
 for(const t of list){
  if(t.recoil>0) t.recoil=Math.max(0,t.recoil-dt*6);
  if(t.muzzle>0) t.muzzle=Math.max(0,t.muzzle-dt*12);
  if(t.flash>0) t.flash-=dt;
  t.spin+=dt;
  if(t.jam>G.time){ for(const w of t.wep){ w.beams=[]; w.on=false; } continue; }
  for(const w of t.wep){
   const k=w.s.kind;
   if(PASSIVE_KINDS[k]) continue;
   if(CONT_KINDS[k]){ continuous(t,w,dt); continue; }
   if(w.again>0){ w.again-=dt; if(w.again<=0){ const x=S(t,w); sonicWave(t,x); } }
   if(k==='gatling') w.spin=Math.max(0,w.spin-dt*(t.evo2?.2:.35));
   w.cd-=dt;
   if(w.cd<=0){
    if(shoot(t,w)){
     t.muzzle=1;
     const x=S(t,w);
     let rate=x.rate;
     if(k==='gatling') rate*=1+w.spin*(x.spin-1);
     w.cd=1/Math.max(.05,rate);
     t.shots++;
    } else w.cd=.1;
   }
  }
 }
 for(let i=G.ghosts.length-1;i>=0;i--){ const g=G.ghosts[i]; g.ghostT-=dt; if(g.ghostT<=0){ G.ghosts.splice(i,1); G.buffsDirty=true; } }
}

/* ═══════════ 투사체 ═══════════ */
function updateShots(dt){
 const out=[];
 for(const p of G.shots){
  if(p.delay>0){ p.delay-=dt; out.push(p); continue; }
  if(p.k==='shell'||p.k==='lob'||p.k==='bomblet'){
   p.tt+=dt/p.dur;
   const k=Math.min(1,p.tt);
   p.x=lerp(p.sx,p.tx,k); p.y=lerp(p.sy,p.ty,k)-Math.sin(k*Math.PI)*(p.k==='bomblet'?22:60);
   if(k>=1){ landShell(p); continue; }
   out.push(p); continue;
  }
  p.life-=dt;
  if(p.life<=0) continue;
  if(!G.lowfx){ const tr=p.tr||(p.tr=[]); tr.push(p.x,p.y); if(tr.length>14) tr.splice(0,2); }
  if(p.k==='missile'){
   if(!p.tg||!p.tg.alive){ p.tg=nearestEnemy(p.x,p.y,260,null,true); }
   if(p.tg){
    const want=Math.atan2(p.tg.y-p.y,p.tg.x-p.x);
    p.ang+=clamp(angDiff(want,p.ang),-p.turn*dt,p.turn*dt);
   }
   p.spd=Math.min(520,p.spd+400*dt);
   p.x+=Math.cos(p.ang)*p.spd*dt; p.y+=Math.sin(p.ang)*p.spd*dt;
   if(!G.lowfx&&Math.random()<.6) part(p.x,p.y,rnd(-15,15),rnd(-15,15),.3,2,'#ffb36b',0,.9);
   if(p.tg&&d2(p.x,p.y,p.tg.x,p.tg.y)<(p.tg.r+6)*(p.tg.r+6)){ missileHit(p); continue; }
   out.push(p); continue;
  }
  /* 직선 · 유도 탄 */
  if(p.tg&&p.tg.alive){ p.tx=p.tg.x; p.ty=p.tg.y; }
  const dx=p.tx-p.x, dy=p.ty-p.y, dist=Math.hypot(dx,dy), step=p.spd*dt;
  if(dist<=step+(p.tg?p.tg.r*.5:4)){
   p.x=p.tx; p.y=p.ty;
   if(projHit(p)) out.push(p);
   continue;
  }
  p.x+=dx/dist*step; p.y+=dy/dist*step;
  out.push(p);
 }
 G.shots=out;
}
/* 명중 처리. 계속 날아가야 하면 true */
function projHit(p){
 const e=p.tg, A=G.aug;
 if(!e||!e.alive){
  if(p.k==='plasma') plasmaBoom(p,p.x,p.y);
  return false;
 }
 const x=p.x0;
 if(p.k==='bullet'){
  const done=hurt(e,p.dmg,{src:p.src,kind:'hit',crit:x.crit,cmul:x.cmul,from:{x:p.src.x,y:p.src.y}});
  if(done) hitAugs(e,done,p.src);
  burst(e.x,e.y,p.col,3,.6);
  p.hit.push(e);
  if(p.bounce>0){ p.bounce--; const n=nearestEnemy(e.x,e.y,120,p.hit); if(n){ p.tg=n; p.dmg*=.8; return true; } }
  if(p.pierce>0){ p.pierce--; const n=nearestEnemy(e.x,e.y,90,p.hit); if(n){ p.tg=n; return true; } }
  return false;
 }
 if(p.k==='dart'){
  const done=hurt(e,p.dmg,{src:p.src,kind:'hit',crit:x.crit,cmul:x.cmul,from:{x:p.x-1,y:p.y}});
  if(done&&!p.hit.length) hitAugs(e,done,p.src);
  if(A.rico_domino) { splash(e.x,e.y,28,p.dmg*.35,p.src,{aug:true,silent:true}); boom(e.x,e.y,28,'#c3ff6b'); }
  p.hit.push(e);
  if(p.bounce>0){
   const n=nearestEnemy(e.x,e.y,115,p.hit,true);
   if(n){ p.bounce--; p.dmg*=p.fall; p.tg=n; SND.play('bounce',70); return true; }
  }
  return false;
 }
 if(p.k==='venom'){
  hurt(e,x.dps*.25,{src:p.src,kind:'hit',silent:true,from:{x:p.src.x,y:p.src.y}});
  if(e.alive){
   poison(e,x.dps,x.dotT,p.src,x.stack,'venom',x.contagion||0);
   if(x.acid) e.shred=Math.min(x.acidMax,(e.shred||0)+x.acid);
   if(A.venom_slow) slowE(e,.2,x.dotT);
  }
  burst(e.x,e.y,p.col,4,.6);
  return false;
 }
 if(p.k==='plasma'){ plasmaBoom(p,e.x,e.y,e); return false; }
 return false;
}
function plasmaBoom(p,x,y,e){
 const A=G.aug;
 if(p.single&&e){
  hurt(e,p.dmg,{src:p.src,kind:'hit',crit:p.x0.crit,cmul:p.x0.cmul,from:{x:p.src.x,y:p.src.y},pen:.3});
  splash(x,y,p.splash,p.dmg*.08,p.src,{silent:true});
  boom(x,y,p.splash*1.6,'#ffffff'); ring(x,y,70,p.col,.5,4); G.shake=Math.max(G.shake,5);
 } else {
  splash(x,y,p.splash,p.dmg,p.src,{crit:p.x0.crit,cmul:p.x0.cmul});
  boom(x,y,p.splash,p.col);
 }
 if(p.pool) G.pools.push({x:x,y:y,r:p.pool,dps:p.dmg*.18,t:p.poolT,max:p.poolT,src:p.src,col:'#ff6b3d'});
 if(A.plasma_chain&&!p.chained){
  const n=nearestEnemy(x,y,160,e?[e]:null);
  if(n){ beamFx(x,y,n.x,n.y,p.col,.25,3); splash(n.x,n.y,p.splash*.7,p.dmg*.5,p.src,{silent:true}); boom(n.x,n.y,p.splash*.7,p.col); }
 }
 SND.play('boom',90);
}
function landShell(p){
 const A=G.aug;
 if(p.k==='lob'){
  G.mines.push({x:p.tx,y:p.ty,lane:p.spot.lane,dist:p.spot.dist,src:p.src,x0:p.x0,arm:.25,col:p.col,auto:false});
  return;
 }
 const st=p.stun||0;
 splash(p.tx,p.ty,p.splash,p.dmg,p.src,{stun:st,crit:p.x0&&p.x0.crit,cmul:p.x0&&p.x0.cmul});
 boom(p.tx,p.ty,p.splash,p.col);
 if(p.k==='shell'){
  if(st){ ring(p.tx,p.ty,p.splash*1.2,'#c9844a',.5,3); G.shake=Math.max(G.shake,3); }
  if(A.mortar_fire&&p.src&&p.src.id==='mortar') G.pools.push({x:p.tx,y:p.ty,r:p.splash*.8,dps:p.dmg*.25,t:2.5,max:2.5,src:p.src,col:'#ff6b3d'});
  if(p.cluster){
   for(let i=0;i<p.cluster;i++){
    const a=i/p.cluster*TAU+rnd(-.3,.3), d=rnd(26,58);
    G.shots.push({k:'bomblet',x:p.tx,y:p.ty,sx:p.tx,sy:p.ty,tx:p.tx+Math.cos(a)*d,ty:p.ty+Math.sin(a)*d,tt:0,dur:.35,dmg:p.bdmg*towerMods(p.src).dm,src:p.src,x0:p.x0,col:p.col,splash:30});
   }
  }
 }
 SND.play('boom',80);
}
function missileHit(p){
 const e=p.tg, A=G.aug;
 const air=e.air?(p.airMul||1)*(A.missile_air&&p.src.id==='missile'?2:1):1;
 hurt(e,p.dmg*air,{src:p.src,kind:'hit',crit:p.x0.crit,cmul:p.x0.cmul,from:{x:p.x-Math.cos(p.ang)*20,y:p.y-Math.sin(p.ang)*20}});
 splash(e.x,e.y,p.splash,p.dmg*.5,p.src,{air:true,silent:true});
 boom(e.x,e.y,p.splash,p.col);
 if(A.missile_split&&!p.mini){
  for(let i=0;i<2;i++){
   const n=nearestEnemy(e.x,e.y,160,[e],true);
   if(n) G.shots.push({k:'missile',x:e.x,y:e.y,ang:rnd(0,TAU),spd:260,turn:8,tg:n,dmg:p.dmg*.4,src:p.src,x0:p.x0,col:p.col,splash:18,airMul:p.airMul,life:2,mini:1});
  }
 }
}

/* ═══════════ 지뢰 · 장판 · 블랙홀 · 메아리 ═══════════ */
function updateMines(dt){
 const keep=[];
 for(const m of G.mines){
  if(m.gone) continue;
  if(m.arm>0){ m.arm-=dt; keep.push(m); continue; }
  let trig=false;
  for(const e of G.enemies){ if(e.alive&&!e.air&&d2(m.x,m.y,e.x,e.y)<(e.r+14)*(e.r+14)){ trig=true; break; } }
  if(trig){ detonate(m); continue; }
  keep.push(m);
 }
 G.mines=keep.filter(m=>!m.gone);
}
function detonate(m){
 if(m.gone) return;
 m.gone=true;
 const x=m.x0, A=G.aug;
 if(x.gravMine){
  for(const e of G.enemies){ if(!e.alive||e.air||d2(m.x,m.y,e.x,e.y)>95*95) continue;
   if(e.lane===m.lane){ const dd=m.dist-e.dist; e.dist+=clamp(dd,-50,50)*(e.D.boss?.2:1); } }
  addFx({k:'implode',x:m.x,y:m.y,r:95,col:'#a98bff',life:.4,max:.4});
 }
 splash(m.x,m.y,x.splash,m.auto?m.dmg:x.dmg*towerMods(m.src).dm,m.src,{freeze:A.mine_ice?1:0});
 boom(m.x,m.y,x.splash,m.col); SND.play('boom',70);
 if(x.chainMine){
  /* gone 표시를 먼저 했으므로 서로를 다시 터뜨리지 않는다 */
  for(const o of G.mines){ if(!o.gone&&d2(m.x,m.y,o.x,o.y)<(x.splash*1.3)*(x.splash*1.3)) detonate(o); }
 }
}
function updatePools(dt){
 const keep=[];
 for(const p of G.pools){
  p.t-=dt;
  if(p.t<=0) continue;
  const r2=p.r*p.r;
  for(const e of G.enemies){ if(e.alive&&!e.air&&d2(p.x,p.y,e.x,e.y)<=r2) hurt(e,p.dps*dt,{src:p.src,kind:'dot',silent:true}); }
  keep.push(p);
 }
 G.pools=keep;
}
function updateVortex(dt){
 const keep=[];
 for(const v of G.vortex){
  v.t-=dt;
  if(v.t<=0) continue;
  const r2=v.r*v.r;
  for(const e of G.enemies){
   if(!e.alive||e.air||d2(v.x,v.y,e.x,e.y)>r2) continue;
   hurt(e,v.dps*dt*towerMods(v.src).dm,{src:v.src,kind:'dot',silent:true});
   if(!e.D.boss) e.root=Math.max(e.root,.08);
   else e.auraSlow=Math.max(e.auraSlow,.4);
  }
  if(Math.random()<.5) { const a=rnd(0,TAU), r=v.r*rnd(.6,1); part(v.x+Math.cos(a)*r,v.y+Math.sin(a)*r,-Math.cos(a)*120,-Math.sin(a)*120,.5,2.5,v.col,0,.95); }
  keep.push(v);
 }
 G.vortex=keep;
}
function updateEcho(dt){
 if(!G.echoQ.length) return;
 const keep=[];
 for(const q of G.echoQ){ q.t-=dt; if(q.t>0){ keep.push(q); continue; } if(q.e.alive) hurt(q.e,q.d,{src:q.src,kind:'hit',aug:true,silent:true,nocrit:true}); }
 G.echoQ=keep;
}

function spawnEnemy(type,lane,dist,hpMul){
 const D=ENEMIES[type], A=G.aug;
 let hm=(hpMul||1)*(G.hard?1.6:1)*(A.reverse_path?2:1)*(D.boss?1:1/DENS);
 if(D.boss&&G.mode==='campaign') hm=(G.hard?1.6:1)*(A.reverse_path?2:1);
 const chArmor=G.mode==='chaos'?Math.floor(G.wave*.35):(G.st?G.st.ch*2:0);
 const e={type:type,D:D,lane:lane||0,dist:Math.max(0,dist||0),x:0,y:0,ang:0,prog:0,
  hp:D.hp*hm,maxHp:D.hp*hm,hpMulBase:hpMul||1,armor:D.armor+(D.boss?0:chArmor),
  shield:D.shield?D.shield.amt*hm:0,shieldMax:D.shield?D.shield.amt*hm:0,shieldT:0,
  spd:D.spd,gold:D.boss?D.gold:D.gold/DENS,r:D.r,col:D.col,air:!!D.air,alive:true,hitT:0,
  slow:0,slowT:0,freeze:0,stun:0,root:0,pois:[],markT:0,markV:0,bounty:false,shred:0,crack:0,auraSlow:0,
  vis:!D.stealth,blinkCd:D.blink?D.blink.cd*.6:0,blinkT:0,jamCd:D.jam?D.jam.cd*.6:0,healCd:rnd(.2,1),
  invuln:0,age:0,wob:Math.random()*TAU,padT:0,blockT:0,wpHit:0};
 if(G.mode==='chaos') e.spd*=1+Math.min(.5,G.wave*.01);
 if(D.giant) initBoss(e);
 const p=e.air?airAt(e.lane,e.dist):ptAt(e.lane,e.dist);
 e.x=p.x; e.y=p.y; e.ang=p.ang;
 G.enemies.push(e);
 if(!SAVE.d.seenEnemy[type]&&!D.minion&&!D.giant&&G.mode==='campaign'&&!G.intro){ G.intro=type; }
 return e;
}

function updateEnemies(dt){
 const A=G.aug, towers=G.towers;
 /* 지원 정보: 레이더 범위, 은신 감지 */
 let radars=null;
 if(A.radar_mark||G.enemies.some(e=>e.D.stealth)) radars=towers.filter(t=>t.id==='radar');
 for(let i=G.enemies.length-1;i>=0;i--){
  const e=G.enemies[i];
  if(!e.alive){ G.enemies.splice(i,1); continue; }
  e.age+=dt; e.wob+=dt*6;
  if(e.hitT>0) e.hitT-=dt;
  if(e.blockT>0) e.blockT-=dt;
  if(e.wpHit>0) e.wpHit-=dt;
  if(e.invuln>0) e.invuln-=dt;
  if(e.slowT>0){ e.slowT-=dt; if(e.slowT<=0) e.slow=0; }
  if(e.freeze>0) e.freeze-=dt;
  if(e.stun>0) e.stun-=dt;
  if(e.root>0) e.root-=dt;
  if(e.markT>0) e.markT-=dt;
  if(e.padT>0) e.padT-=dt;
  /* 은신 · 레이더 */
  if(e.D.stealth){
   let v=!!A.stealth_reveal;
   if(!v) for(const t of towers){ if(d2(t.x,t.y,e.x,e.y)<92*92){ v=true; break; } }
   if(!v&&radars) for(const r of radars){ const x=S(r,r.wep[0]); if(x.reveal&&d2(r.x,r.y,e.x,e.y)<x.reveal*x.reveal){ v=true; break; } }
   e.vis=v;
  }
  if(A.radar_mark&&radars){ e.radarMk=false; for(const r of radars){ const x=S(r,r.wep[0]); if(d2(r.x,r.y,e.x,e.y)<x.rng*x.rng){ e.radarMk=true; break; } } }
  /* 독 · 화상 */
  if(e.pois.length){
   for(let k=e.pois.length-1;k>=0;k--){
    const q=e.pois[k]; q.t-=dt;
    hurt(e,q.dps*dt,{src:q.src,kind:'dot',silent:true});
    if(q.t<=0) e.pois.splice(k,1);
    if(!e.alive) break;
   }
   if(!e.alive){ G.enemies.splice(i,1); continue; }
   if(!G.lowfx&&Math.random()<dt*6) part(e.x+rnd(-6,6),e.y+rnd(-6,6),rnd(-9,9),-rnd(12,30),.5,2,e.pois[0]&&e.pois[0].tag==='burn'?'#ff9a3c':'#7dff9b');
  }
  if(e.D.shield&&e.shield<e.shieldMax){
   if(e.shieldT>0) e.shieldT-=dt;
   else e.shield=Math.min(e.shieldMax,e.shield+e.D.shield.regen*(e.shieldMax/e.D.shield.amt)*dt);
  }
  if(e.D.heal) enemyHeal(e,dt);
  if(e.D.blink) enemyBlink(e,dt);
  if(e.D.jam) enemyJam(e,dt);
  if(e.D.giant) bossThink(e,dt);
  if(!e.alive){ G.enemies.splice(i,1); continue; }

  /* 이동 */
  const LP=G.paths[e.lane]||G.paths[0];
  let sp=e.spd*(e.air?LP.airMul:LP.spdMul);
  if(A.chrono) sp*=1.3;
  if(A.reverse_path) sp*=.5;
  if(A.boss_slow&&e.D.boss) sp*=.7;
  if(G.overload&&!e.D.boss) sp*=1.2;
  if(e.D.berserk) sp*=1+(1-e.hp/e.maxHp)*e.D.berserk;
  if(e.padT>0) sp*=A.pad_reverse?.6:1.5;
  if(e.dash) sp*=6;
  const sl=Math.max(e.slowT>0?e.slow:0,e.auraSlow);
  e.auraSlow=0;
  sp*=1-Math.min(.85,sl);
  if(e.freeze>0||e.stun>0||e.root>0||G.freezeT>0&&!(e.D.boss&&G.freezeT<G.freezeBoss)) sp=0;
  if(e.bossHold>0) sp=0;
  e.dist+=sp*dt;
  if(e.dash){ e.dashLeft-=sp*dt; if(e.dashLeft<=0) e.dash=false; }
  const P=G.paths[e.lane]||G.paths[0], len=e.air?P.airLen:P.total;
  e.prog=e.dist/len+(e.D.boss?0:0);
  if(e.dist>=len){ leak(e); G.enemies.splice(i,1); continue; }
  const p=e.air?airAt(e.lane,e.dist):ptAt(e.lane,e.dist);
  e.x=p.x; e.y=p.y; e.ang=p.ang;
  /* 가속 패드 */
  if(G.pads.length&&!e.air&&e.padT<=0) for(const pd of G.pads){ if(d2(pd.x,pd.y,e.x,e.y)<20*20){ e.padT=3; break; } }
 }
}
function enemyHeal(e,dt){
 e.healCd-=dt;
 if(e.healCd>0) return;
 e.healCd=e.D.heal.cd;
 const r2=e.D.heal.rad*e.D.heal.rad, amt=e.D.heal.amt*e.hpMulBase*(G.aug.heal_block?.2:1);
 let n=0;
 for(const o of G.enemies){
  if(!o.alive||o===e||o.hp>=o.maxHp||d2(e.x,e.y,o.x,o.y)>r2) continue;
  o.hp=Math.min(o.maxHp,o.hp+amt); beamFx(e.x,e.y,o.x,o.y,'#6effc4',.3,2);
  if(++n>=3) break;
 }
 if(n){ ring(e.x,e.y,e.D.heal.rad,'#6effc4',.4,1.5); SND.play('heal',300); }
}
function enemyBlink(e,dt){
 const held=e.freeze>0||e.stun>0||e.root>0;
 if(e.blinkT>0){
  if(held){ e.blinkT=0; return; }
  e.blinkT-=dt;
  if(e.blinkT<=0){
   const len=G.paths[e.lane].total, nd=Math.min(e.dist+e.D.blink.dist,len-8);
   if(nd>e.dist){
    ring(e.x,e.y,e.r+8,e.col,.35,2); burst(e.x,e.y,e.col,8,1.1);
    e.dist=nd; const p=ptAt(e.lane,nd); e.x=p.x; e.y=p.y;
    ring(e.x,e.y,e.r+8,e.col,.35,2); SND.play('blink',80);
   }
  }
 } else if(!held){
  e.blinkCd-=dt;
  if(e.blinkCd<=0){ e.blinkT=e.D.blink.tele; e.blinkCd=e.D.blink.cd; }
 }
}
function jamTower(t,dur){
 dur*=G.aug.jam_immune?.3:1;
 t.jam=Math.max(t.jam,G.time+dur);
 ring(t.x,t.y,26,'#ffd34d',.4,2); say(t.x,t.y-18,'정지','#ffd34d',11);
 G.buffsDirty=true;
}

/* ═══════════ 거대 보스 ═══════════ */
const WP_ANG={crusher:[-Math.PI/2,Math.PI*.25,Math.PI*.85],hive:[Math.PI,-Math.PI*.3,Math.PI*.4],overlord:[Math.PI/2,-Math.PI*.8,0]};
function initBoss(e){
 e.phase=1; e.wpAng=WP_ANG[e.type][0]; e.p3at=.33;
 e.tA=e.type==='overlord'?7:6; e.tB=8; e.tele=null; e.bossHold=0;
 G.bosses.push(e);
 if(G.stats.bossStart<0) G.stats.bossStart=G.time;
 G.bossPending=e;
}
function bossThink(e,dt){
 const f=e.hp/e.maxHp;
 if(e.phase===1&&f<=.66) bossPhase(e,2);
 else if(e.phase===2&&f<=e.p3at) bossPhase(e,3);
 if(e.bossHold>0) e.bossHold-=dt;
 /* 예고 중인 행동 */
 if(e.tele){
  e.tele.t-=dt;
  if(e.type==='overlord'&&e.tele.k==='emp'&&(e.stun>0||e.freeze>0)){
   say(e.x,e.y-e.r-20,'충전 차단!','#9dff5e',16); ring(e.x,e.y,e.r+20,'#9dff5e',.5,3);
   e.tele=null; e.tA=6; return;
  }
  if(e.tele.t<=0){ const k=e.tele; e.tele=null; bossAct(e,k); }
  return;
 }
 e.tA-=dt;
 if(e.tA>0) return;
 const H=G.hard;
 if(e.type==='crusher'){
  if(e.phase===1||(e.phase===3&&Math.random()<.5)){ startTele(e,{k:'charge',t:2}); e.tA=e.phase===3?6:9; SND.play('charge'); }
  else { const tg=stompTarget(e,H?2:1); if(tg.length){ startTele(e,{k:'stomp',t:1.2,targets:tg}); } e.tA=e.phase===3?6:7; }
 } else if(e.type==='hive'){
  if(e.phase<3){ bossSpawn(e,'splitter',3); if(H&&Math.random()<.4) bossSpawn(e,'carrier',1); e.tA=8; }
  else { bossShield(e); bossSpawn(e,'shard',2); e.tA=7; }
 } else if(e.type==='overlord'){
  if(e.phase===2&&(e.tB-=1)<=0){ startTele(e,{k:'tp',t:1,d:Math.min(e.dist+160,G.paths[e.lane].total-60)}); e.tB=H?2:3; e.tA=3; return; }
  startTele(e,{k:'emp',t:1.2}); SND.play('empwarn');
  e.tA=e.phase===3?10:(e.phase===2?14:12);
  if(e.phase===3) bossSpawn(e,'berserk',2);
 }
}
function startTele(e,k){ e.tele=k; k.max=k.t; G.tele.push(e); }
function stompTarget(e,n){
 const list=G.towers.filter(t=>t.jam<=G.time&&d2(t.x,t.y,e.x,e.y)<130*130).sort((a,b)=>d2(a.x,a.y,e.x,e.y)-d2(b.x,b.y,e.x,e.y));

}
function bossAct(e,k){

  e.dash=true; e.dashLeft=120; G.shake=Math.max(G.shake,8); SND.play('stomp');
 } else if(k.k==='stomp'){
  for(const t of k.targets){ if(G.towers.indexOf(t)<0) continue; jamTower(t,4); G.stats.stomped++; boom(t.x,t.y,40,'#ff9a3c'); }
  G.shake=Math.max(G.shake,12); SND.play('stomp');
 } else if(k.k==='emp'){
  const R=G.hard?234:180, r2=R*R; let n=0;
  for(const t of G.towers){ if(d2(e.x,e.y,t.x,t.y)<=r2){ jamTower(t,3); n++; if(n<=10) beamFx(e.x,e.y,t.x,t.y,'#ffd34d',.4,2); } }
  ring(e.x,e.y,R,'#ffd34d',.7,5); ring(e.x,e.y,R*.6,'#fff2a8',.5,3);
  G.shake=Math.max(G.shake,10); SND.play('emp');
 } else if(k.k==='tp'){
  ring(e.x,e.y,e.r+20,'#ff4d6d',.5,4); burst(e.x,e.y,'#ff4d6d',30,2);
  e.dist=k.d; const p=ptAt(e.lane,e.dist); e.x=p.x; e.y=p.y;

 }
}
function bossSpawn(e,type,n){

function bossShield(e){

  if(!o.alive||d2(e.x,e.y,o.x,o.y)>200*200) continue;
  const sh=o.D.boss?o.maxHp*.08:o.maxHp*.4;

const BOSS_LINES={

}
function bossDown(e){

/* ═══════════ 웨이브 ═══════════ */
function waveDefNow(n){ return G.mode==='chaos'?chaosWave(n):G.waves[n-1]; }
function hpMulNow(n){ return G.mode==='chaos'?chaosHpMul(n):waveHpMul(G.st,n); }
function startWave(bonus){
 if(G.over||G.wave>=G.totalWaves) return;
 G.wave++;
 G.waveOn=true; G.waveT=0; G.prep=0;
 const def=waveDefNow(G.wave), hm=hpMulNow(G.wave), A=G.aug;
 const lanes=G.paths.length;
 let boss=false, k=0;
 G.queue=[];
 for(const g of def){
  const D=ENEMIES[g[0]];
  if(D.boss) boss=true;
  let cnt=g[1]; if(A.double_wave&&!D.boss) cnt*=2;
  const gap=A.double_wave&&!D.boss?g[2]*.55:g[2];
  for(let i=0;i<cnt;i++) G.queue.push({t:g[0],at:g[3]+i*gap,lane:(k++)%lanes,hm:D.boss&&G.mode==='chaos'?hm/2.4:hm});
 }
 G.queue.sort((a,b)=>a.at-b.at);
 G.stats.waveTotal=G.queue.length;
 /* 웨이브 시작 효과 */
 let sh=0; for(const t of G.towers) if(t.id==='barrier') sh+=S(t,t.wep[0]).shield||0;
 G.cShield=Math.min(30,G.cShield+sh);
 if(A.first_strike) G.firstStrikeT=6;
 if(A.gamble){ G.gambleMul=Math.random()<.5?2:.7; toast('도박사: 이번 웨이브 피해 '+(G.gambleMul>1?'2배!':'0.7배…'),G.gambleMul>1?'gold':'bad'); }
 if(A.blood_price){ G.lives-=1; if(G.lives<=0){ G.lives=0; gameOver(false); return; } }
 if(A.mine_everywhere) for(let i=0;i<3;i++){
  const lane=Math.floor(Math.random()*lanes), P=G.paths[lane], d=P.total*rnd(.2,.85), p=ptAt(lane,d);
  G.mines.push({x:p.x,y:p.y,lane:lane,dist:d,src:null,x0:{splash:48},dmg:90*hm,arm:.2,col:'#ffe066',auto:true});
 }
 if(G.terr&&G.terr.moving) rollMoving();
 if(G.terr&&G.terr.blackout&&G.wave%3===0){ G.blackout=(G.wave/3)%2; banner('정전!',(G.blackout===0?'왼쪽':'오른쪽')+' 구역 탑 피해 -30%',true); }
 if(bonus>0){ G.gold+=bonus; say(W-160,H-40,'조기 호출 +'+bonus,'#ffc247',14); }
 const label=G.mode==='chaos'?'WAVE '+G.wave:'WAVE '+G.wave+' / '+G.totalWaves;
 if(!(G.terr&&G.terr.blackout&&G.wave%3===0)) banner(label,boss?'거대 보스 접근':(G.wave===G.totalWaves?'마지막 웨이브':''),boss);
 SND.play('wave');
 SND.intensity=clamp(.25+G.wave/(G.mode==='chaos'?30:G.totalWaves)*.75,0,1);
 tutEvent('wave');
 syncHUD(true);
}
function callWave(){
 if(G.over||G.cine||G.augPending) return;
 if(!G.waveOn){
  if(G.wave>=G.totalWaves) return;
  const bonus=Math.round(Math.ceil(G.prep)*3*(G.aug.wave_gold?3:1)*(G.mode==='chaos'?1:CH_GOLD[G.st.ch]));
  startWave(bonus);
 } else if(!G.queue.length&&G.wave<G.totalWaves){
  /* 남은 적이 있어도 다음 웨이브를 당겨 부를 수 있다 */
  endWave(true);
  if(!G.augPending) startWave(Math.round(10*(G.mode==='chaos'?1:CH_GOLD[G.st.ch])));
 }
}
function endWave(early){
 G.waveOn=false;
 G.punchSkipBanner=false;
 const A=G.aug, chG=G.mode==='chaos'?1+G.wave*.02:CH_GOLD[G.st.ch];
 let bonus=Math.round((40+G.wave*8)*chG);
 let mined=0, interest=0, repair=0;
 for(const t of G.towers){
  for(const w of t.wep){
   const x=w.s;
   if(x.kind==='income'){ let inc=x.inc*chG; if(A.miner_crit&&Math.random()<.25){ inc*=3; say(t.x,t.y-20,'노다지!','#ffc247',13); } mined+=inc; if(x.interest) interest+=Math.min(x.intCap,G.gold*x.interest); }
   if(x.kind==='core'&&x.repair) repair+=x.repair;
  }
 }
 if(A.interest) interest+=Math.min(200,G.gold*.05);
 if(A.economy) bonus+=300;
 if(A.energy_battery) for(const s of G.skills) bonus+=Math.round(s.cd*2);
 bonus+=Math.round(mined+interest);
 G.gold+=bonus;
 const c=G.paths[0].core;
 say(c.x,c.y-50,'+'+bonus,'#ffc247',18);
 if(!(G.mode==='chaos'&&G.wave%3===0)){ banner('방어 성공','+'+bonus+' 에너지',false); SND.play('clear'); }
 if(repair) healCore(repair);
 if(A.barrier_regen&&G.cShield>0) healCore(1);
 if(A.cooldown_reset) for(const s of G.skills) s.cd=0;
 G.blackout=-1;
 G.prepMax=G.mode==='chaos'?12:10; G.prep=G.prepMax;
 if(G.mode==='chaos'&&G.wave%3===0){ offerAugments(); }
 syncHUD(true);
}
function stepWaves(dt){
 if(G.waveOn){
  G.waveT+=dt;
  while(G.queue.length&&G.queue[0].at<=G.waveT){
   const q=G.queue.shift();
   spawnEnemy(q.t,q.lane,0,q.hm);
  }
  if(!G.queue.length&&!G.enemies.length){
   if(G.wave>=G.totalWaves) victory();
   else endWave(false);
  }
 } else if(!G.over&&!G.augPending){
  if(G.prep>0){
   if(tutHold()) G.prep=Math.max(G.prep,6);

}

/* ═══════════ 한 프레임 ═══════════ */
function step(dt){
 G.frame++;
 stepFx(dt);
 if(G.over||G.augPending) return;
 G.time+=dt;
 if(G.buffsDirty) refreshAuras();
 stepSkills(dt);
 stepWaves(dt);
 if(G.over) return;
 updateEnemies(dt);
 updateTowers(dt);
 updateShots(dt);
 updateMines(dt);
 updatePools(dt);
 updateVortex(dt);
 updateEcho(dt);
 if(G.killRateT>0){ G.killRateT-=dt; if(G.killRateT<=0) G.killRate=0; }
 if(G.gold>G.stats.maxGold) G.stats.maxGold=G.gold;
 if(G.towers.length>G.stats.maxTowers) G.stats.maxTowers=G.towers.length;
 if(G.tele.length) G.tele=G.tele.filter(e=>e.alive&&e.tele);
 /* 교란이 풀린 지원 탑은 오라를 다시 계산해야 한다 */
 if(G.frame%15===0) for(const t of G.towers){ if(t.jam>0&&t.jam<=G.time){ t.jam=0; G.buffsDirty=true; } }
}
function stepFx(dt){
 if(G.shake>0) G.shake=Math.max(0,G.shake-dt*40);
 let w=0; const fx=G.fx;
 for(let i=0;i<fx.length;i++){ const f=fx[i]; f.life-=dt; if(f.life>0) fx[w++]=f; } fx.length=w;
 const ps=G.parts; w=0;
 for(let i=0;i<ps.length;i++){ const p=ps[i]; p.life-=dt; if(p.life<=0) continue;
  p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=p.grav*dt; const k=Math.pow(p.drag,dt*60); p.vx*=k; p.vy*=k; ps[w++]=p; }
 ps.length=w;
 const tx=G.texts; w=0;
 for(let i=0;i<tx.length;i++){ const q=tx[i]; q.life-=dt; if(q.life<=0) continue; q.y+=q.vy*dt; q.x+=q.vx*dt; q.vy*=Math.pow(.94,dt*60); tx[w++]=q; }
 tx.length=w;
}

/* ═══════════ 승패 ═══════════ */
function starCheck(st){
 const s=st.star, k=s[0], v=s[1], S2=G.stats;
 switch(k){
  case 'noLeak': return S2.leaked===0;
  case 'maxTowers': return S2.maxTowers<=v;
  case 'noSkills': return S2.skillsUsed===0;
  case 'noTower': return !S2.built[v];
  case 'noRole': return !Object.keys(S2.built).some(id=>TOWERS[id].role===v);
  case 'time': return G.time<=v;
  case 'noStomp': return S2.stomped===0;
  case 'maxEvos': return S2.evos<=v;
  case 'maxGold': return S2.maxGold<=v;
  case 'noSplitLeak': return S2.splitLeak===0;
  case 'maxLeak': return S2.leaked<=v;
  case 'maxSkills': return S2.skillsUsed<=v;
  case 'bossTime': return S2.bossTime>0&&S2.bossTime<=v;
 }
 return false;
}
function victory(){
 if(G.over) return;
 G.over=true; G.waveOn=false;
 closePop(); tutEnd(false);
 const st=G.st, D=SAVE.d;
 const half=G.lives>=G.maxLives/2, cond=starCheck(st);
 const stars=1+(half?1:0)+(cond?1:0);
 const first=!D.cleared[st.id];
 const prevStars=D.stars[st.id]||0;
 D.cleared[st.id]=1;
 D.stars[st.id]=Math.max(prevStars,stars);
 if(G.hard) D.hard[st.id]=1;
 if(!D.best[st.id]||G.time<D.best[st.id]) D.best[st.id]=Math.round(G.time);
 D.losses[st.id]=0;
 D.stats.time+=G.time;
 if(st.tut) D.tut=true;
 SAVE.save();
 SND.play('win');
 SND.stopMusic();
 setTimeout(()=>showResult({win:true,stars:stars,half:half,cond:cond,first:first,unlock:first?st.unlock:null,newBest:stars>prevStars}),900);
}
function gameOver(win){
 if(G.over) return;
 G.over=true; G.waveOn=false;
 closePop(); tutEnd(false);
 const D=SAVE.d;
 D.stats.time+=G.time;
 let near=null;
 if(G.bosses.length){ const b=G.bosses.reduce((a,c)=>a.hp/a.maxHp<c.hp/c.maxHp?a:c); near=Math.max(1,Math.round(b.hp/b.maxHp*100)); }
 if(G.mode==='campaign'){
  D.losses[G.st.id]=(D.losses[G.st.id]||0)+1;
 } else {
  D.chaos.push({wave:G.wave,score:Math.round(G.stats.score),map:G.mapId,towers:G.loadout.slice(),augs:G.augList.map(a=>a[0]),date:Date.now()});
  D.chaos.sort((a,b)=>b.wave-a.wave||b.score-a.score);
  D.chaos=D.chaos.slice(0,10);
 }
 SAVE.save();
 SND.play('lose');
 SND.stopMusic();
 setTimeout(()=>showResult({win:false,near:near}),900);
}

function augAllowed(a){
 const id=a[0], A=G.aug;
 if(A[id]) return false;
 const tw=id.split('_')[0];
 const map={pulse:'pulse',sniper:'sniper',rico:'ricochet',laser:'laser',mortar:'mortar',missile:'missile',mine:'mines',plasma:'plasma',arc:'arc',cryo:'cryo',
  venom:'venom',flame:'flame',grav:'grav',sonic:'sonic',mark:'marker',net:'net',amp:'amp',radar:'radar',miner:'miner',barrier:'barrier'};
 if(a[1]===1&&map[tw]&&id!=='mine_everywhere'&&G.loadout.indexOf(map[tw])<0) return false;
 const has=s=>G.skills.some(k=>k.id===s);
 if(id==='skill_dmg'||id==='orbital_auto') return has('orbital');
 if(id==='freeze_long'||id==='time_lord') return has('freeze');
 if(id==='overclock_long') return has('overclock');
 if(id==='repair_more') return has('repair');
 if(id==='surge_more') return has('surge');
 if(id==='pad_reverse') return G.pads.length>0;
 if(id==='energy_power') return G.energy.size>0||!!A.energy_tiles||(G.terr&&G.terr.moving);
 if(id==='seventh') return unlockedTowers().length>G.loadout.length;
 if(id==='monoculture') return G.towers.length>0;
 if(id==='dual_evo') return true;
 if(id==='pacifist') return G.towers.length<=5;
 if(id==='overlord_heart') return !A.phoenix;
 return true;
}
function rollAugments(){
 const n=G.aug.chaos_luck?4:3, out=[];
 const w=G.aug.chaos_luck?[30,35,35]:[56,31,13];
 for(let tries=0;tries<200&&out.length<n;tries++){
  let r=Math.random()*100, tier=r<w[0]?1:(r<w[0]+w[1]?2:3);
  const pool=AUGS.filter(a=>a[1]===tier&&augAllowed(a)&&out.indexOf(a)<0);
  if(!pool.length) continue;
  out.push(pool[Math.floor(Math.random()*pool.length)]);
 }
 return out;
}
function offerAugments(){
 const picks=rollAugments();
 if(!picks.length) return;
 G.augPending=true;
 showAugPick(picks);
}
function takeAug(id){
 const a=AUG_BY_ID[id], A=G.aug;
 G.augPending=false;
 A[id]=true; G.augList.push(a);
 SND.play('aug'+a[1]);
 screenFlash(RARITY[a[1]].c+'88');
 switch(id){
  case 'lives_up': G.maxLives+=10; G.lives+=10; break;
  case 'overlord_heart': G.lives=1; G.maxLives=1; break;
  case 'second_core': G.maxLives*=2; G.lives=Math.min(G.maxLives,G.lives*2); break;
  case 'energy_tiles': addEnergyTiles(3); break;
  case 'energy_path': energyPath(); break;
  case 'repair_more': for(const s of G.skills) if(s.id==='repair') s.uses+=2; break;
  case 'monoculture': { let best=null,bn=0; for(const k in G.kinds||{}) if(G.kinds[k]>bn){ bn=G.kinds[k]; best=k; } A.monoculture=best||G.loadout[0]; toast('단일 품종: '+TOWERS[A.monoculture].n,'gold'); break; }
  case 'dual_evo': G.dualPending=true; break;
  case 'amp_self': for(const t of G.towers) if(t.id==='amp') rebuildWeapons(t); break;
 }
 G.buffsDirty=true;
 for(const t of G.towers) for(const w of t.wep) w.spots=null;
 buildShop(); buildSkills(); syncHUD(true);
 if(id==='seventh') showSeventhPick();
}
function addEnergyTiles(n){
 const c=[];
 for(let ty=0;ty<ROWS;ty++) for(let tx=0;tx<COLS;tx++){
  if(!buildable(tx,ty)||isEnergy(tx,ty)) continue;
  let v=0; for(const k of G.pathTiles){ const [px,py]=k.split(',').map(Number); if((px-tx)*(px-tx)+(py-ty)*(py-ty)<=9) v++; }
  c.push({tx:tx,ty:ty,v:v});
 }
 c.sort((a,b)=>b.v-a.v);
 const top=c.slice(0,20);
 for(let i=0;i<n&&top.length;i++){ const k=top.splice(Math.floor(Math.random()*top.length),1)[0]; G.energy.add(tkey(k.tx,k.ty)); ring((k.tx+.5)*TILE,(k.ty+.5)*TILE,30,'#2fe0ff',.8,3); }
}
function energyPath(){
 const P=G.paths[0], picks=[.35,.6];
 for(const f of picks){
  const p=ptAt(0,P.total*f), tx=Math.floor(p.x/TILE), ty=Math.floor(p.y/TILE);
  const k=tkey(tx,ty);
  if(G.pathTiles.has(k)){ G.pathBuild.add(k); G.energy.add(k); ring(p.x,p.y,30,'#2fe0ff',.8,3); }
 }
}
